            make -C "$kernel" ARCH=arm64 CROSS_COMPILE="$cross" olddefconfig
          PATH="$(dirname "$compiler"):$PATH" timeout 1800s \
            make -C "$kernel" ARCH=arm64 CROSS_COMPILE="$cross" -j2 Image
          test -s "$kernel/usr/initramfs_data.o"
          sha256sum "$work/air6-first-stage-initramfs.cpio" \
            "$kernel/arch/arm64/boot/Image"
          echo 'PUBLIC_AIR6_FIRST_STAGE_KERNEL_IMAGE_SOURCE_BUILT_PASS'
          # Unsigned P25 only when caller has supplied a validated exact boot
          # configuration; the public repo intentionally contains no private
          # load addresses, proprietary template or signer.
          gzip -n -9 -c "$kernel/arch/arm64/boot/Image" > "$work/air6-native-Image.gz"
          gzip -n -9 -c "$work/air6-first-stage-initramfs.cpio" > "$work/air6-native-initramfs.cpio.gz"
          native_dtb="$kernel/arch/arm64/boot/dts/mediatek/mt6990-air-terminal-6.dtb"
          test -s "$native_dtb"
          if test -n "${SBAT6_P25_BOOT_V2_CONFIG:-}"; then
            test -f "$SBAT6_P25_BOOT_V2_CONFIG"
            install -d -m 0700 "$work/private-p25"
            p25="$work/private-p25/boot_a.unsigned.p25"
            python3 "$GITHUB_WORKSPACE/tools/boot/pack_p25_unsigned_v2.py" \
              --kernel "$work/air6-native-Image.gz" \
              --ramdisk "$work/air6-native-initramfs.cpio.gz" \
              --dtb "$native_dtb" \
              --config "$SBAT6_P25_BOOT_V2_CONFIG" --output "$p25"
            python3 "$GITHUB_WORKSPACE/tools/boot/verify_p25_independent.py" \
              --p25 "$p25" --kernel "$work/air6-native-Image.gz" \
              --ramdisk "$work/air6-native-initramfs.cpio.gz" --dtb "$native_dtb" \
              --config "$SBAT6_P25_BOOT_V2_CONFIG"
            python3 "$GITHUB_WORKSPACE/tools/build/verify_unsigned_pair.py" \
              --p25 "$p25" --kernel "$work/air6-native-Image.gz" \
              --ramdisk "$work/air6-native-initramfs.cpio.gz" \
              --dtb "$native_dtb" --config "$SBAT6_P25_BOOT_V2_CONFIG" \
              --p26 "$work/private-p26/packed/rootfs_a.p26" \
              --producer "$work/private-p26/packed/p26-receipt.json" \
              --independent "$work/private-p26/packed/p26-independent-attestation.json" \
              --cpio "$work/air6-first-stage-initramfs.cpio" \
              --out "$work/private-p25/unsigned-p25-p26-pair.json"
            echo 'PUBLIC_AIR6_SOURCE_P25_P26_FIRST_STAGE_PAIR_BYTE_IDENTITY_PASS'
          else
            echo 'P25_BLOCKED_RC14_COMPATIBLE_BOOT_V2_CONFIGURATION_UNAVAILABLE'
            printf '%s\n' '## P25 manufacture status' '' \
              'BLOCKED: no independently validated SBAT6_P25_BOOT_V2_CONFIG was supplied.' \
              'No P25 candidate or P25/P26 pair receipt was produced.' \
              'P26 bytes remain ephemeral; no firmware artifact was uploaded.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'LIMIT: Air6 bootloader acceptance and hardware cold boot NOT verified'
