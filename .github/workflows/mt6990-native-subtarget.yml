name: MT6990 OpenWrt native subtarget and package build
on:
  pull_request:
    paths:
      - tools/build/mt6990-target/**
      - tools/build/stage_mt6990_subtarget.py
      - tests/test_mt6990_native_subtarget.py
      - config/source-catalog.json
      - .github/workflows/mt6990-native-subtarget.yml
permissions:
  contents: read
jobs:
  native-defconfig:
    name: Real upstream OpenWrt make defconfig (no firmware)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test staging logic and source identity
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_mt6990_native_subtarget.py' -v
          python3 tools/build/verify_source_catalog.py
      - name: Pin clean upstream OpenWrt and register noninstallable target
        shell: bash
        run: |
          set -euo pipefail
          pin=5799d2da76998be50432b0a3325b42713b4b619b
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          git clone --quiet --no-checkout --filter=blob:none \
            https://github.com/openwrt/openwrt.git "$work/openwrt"
          git -C "$work/openwrt" fetch --quiet --depth=1 origin "$pin"
          git -C "$work/openwrt" checkout --quiet --detach "$pin"
          test "$(git -C "$work/openwrt" rev-parse HEAD)" = "$pin"
          python3 tools/build/stage_mt6990_subtarget.py \
            --tree "$work/openwrt" --report "$work/mt6990-source-report.json"
          python3 - "$work/mt6990-source-report.json" <<'PY'
          import json, sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text())
          assert result["status"] == "MT6990_NATIVE_OPENWRT_SOURCE_SUBTARGET_STAGED"
          assert result["upstream_openwrt_commit"] == "5799d2da76998be50432b0a3325b42713b4b619b"
          assert result["signed"] is False and result["firmware_outputs"] == "NONE"
          print("PUBLIC_MT6990_SOURCE_REGISTRATION_PASS")
          PY
          cat > "$work/openwrt/.config" <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_mt6990=y
          EOF
          # Native OpenWrt target validation requires umask 022.
          umask 022
          make -C "$work/openwrt" defconfig
          grep -qx 'CONFIG_TARGET_mediatek_mt6990=y' "$work/openwrt/.config"
          # The kernel-less package gate must not inherit MediaTek GPIO/LED
          # modules or generic router offload modules from parent defaults.
          for pkg in kmod-gpio-button-hotplug kmod-leds-gpio kmod-nft-offload; do
            if grep -qE "^CONFIG_PACKAGE_${pkg}=[ym]$" "$work/openwrt/.config"; then
              echo "Unexpected kernel-coupled default in userspace-only build: $pkg" >&2
              exit 1
            fi
          done
          test -s "$work/openwrt/target/linux/mediatek/mt6990/config-6.18"
          test -s "$work/openwrt/target/linux/mediatek/mt6990/target.mk"
          ! grep -qE '^[[:space:]]*define Device/' \
            "$work/openwrt/target/linux/mediatek/image/mt6990.mk"
          echo 'PUBLIC_MT6990_REAL_OPENWRT_DEFCONFIG_PASS'
          echo 'NO_DEVICE_PROFILE_NO_FIRMWARE_NO_SIGNING_NO_HARDWARE'

  native-package-compile:
    name: Compile real OpenWrt procd/netifd packages (noninstallable)
    needs: native-defconfig
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build pinned native MT6990 userspace package closure
        shell: bash
        run: |
          set -euo pipefail
          pin=5799d2da76998be50432b0a3325b42713b4b619b
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          git clone --quiet --no-checkout --filter=blob:none \
            https://github.com/openwrt/openwrt.git "$work/openwrt"
          git -C "$work/openwrt" fetch --quiet --depth=1 origin "$pin"
          git -C "$work/openwrt" checkout --quiet --detach "$pin"
          test "$(git -C "$work/openwrt" rev-parse HEAD)" = "$pin"
          python3 tools/build/stage_mt6990_subtarget.py \
            --tree "$work/openwrt" --report "$work/staging-report.json"
          cat > "$work/openwrt/.config" <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_mt6990=y
          CONFIG_PACKAGE_busybox=y
          CONFIG_PACKAGE_procd=y
          CONFIG_PACKAGE_ubus=y
          CONFIG_PACKAGE_uci=y
          CONFIG_PACKAGE_netifd=y
          CONFIG_PACKAGE_dropbear=y
          # CONFIG_SIGNED_PACKAGES is not set
          EOF
          umask 022
          make -C "$work/openwrt" defconfig
          grep -qx 'CONFIG_TARGET_mediatek_mt6990=y' "$work/openwrt/.config"
          # The kernel-less package gate must not inherit MediaTek GPIO/LED
          # modules or generic router offload modules from parent defaults.
          for pkg in kmod-gpio-button-hotplug kmod-leds-gpio kmod-nft-offload; do
            if grep -qE "^CONFIG_PACKAGE_${pkg}=[ym]$" "$work/openwrt/.config"; then
              echo "Unexpected kernel-coupled default in userspace-only build: $pkg" >&2
              exit 1
            fi
          done
          for pkg in busybox procd ubus uci netifd dropbear; do
            grep -qx "CONFIG_PACKAGE_${pkg}=y" "$work/openwrt/.config" || {
              echo "Missing selected native package: $pkg" >&2
              exit 1
            }
          done
          # Build OpenWrt's actual host tools, cross-toolchain and target
          # packages; no target/install, image recipe, signer or flash step.
          make -C "$work/openwrt" -j2 tools/install
          make -C "$work/openwrt" -j2 toolchain/install
          # The actual OpenWrt procd dependency closure reaches package/kernel/linux
          # even without selected kmod defaults. Build the native MT6990 kernel
          # first rather than hiding or bypassing its dependency. This is still
          # a generic source-stage Image, NOT an Air6-matched DTS/AP firmware.
          # Preserve the actual Kbuild failure in hosted logs if a choice or
          # driver dependency still blocks the matching native kernel.
          make -C "$work/openwrt" -j2 V=s target/linux/compile
          if ! find "$work/openwrt/build_dir" -type f \
              -path '*/linux-mediatek_mt6990/linux-*/arch/arm64/boot/Image' \
              -size +0c -print -quit | grep -q .; then
            echo "Native MT6990 kernel Image was not produced" >&2
            exit 1
          fi
          echo 'PUBLIC_MT6990_NATIVE_KERNEL_IMAGE_BUILD_PASS'
          # Now build the real package dependency closure with matching
          # OpenWrt kernel headers/modules metadata. No target/install.
          make -C "$work/openwrt" -j2 \
            package/system/procd/compile \
            package/network/config/netifd/compile
          package_dir="$work/openwrt/bin/packages"
          test -d "$package_dir"
          for pkg in procd netifd; do
            if ! find "$package_dir" -type f \
                \( -name "${pkg}-*.apk" -o -name "${pkg}_*.ipk" \) \
                -print -quit | grep -q .; then
              echo "Missing actual compiled OpenWrt package: $pkg" >&2
              exit 1
            fi
          done
          echo 'PUBLIC_MT6990_REAL_OPENWRT_PROCD_NETIFD_PACKAGES_PASS'
          echo 'NONINSTALLABLE_PACKAGES_ONLY_NO_DEVICE_PROFILE_NO_SIGNING'
          # Close the next material gap: compile the actual first-boot tools
          # from the same pinned OpenWrt toolchain, not a synthetic rootfs.
          # Do NOT run target/install, build a Device profile or sign an index.
          if grep -q '^CONFIG_SIGNED_PACKAGES=y$' "$work/openwrt/.config"; then
            echo 'Package signing unexpectedly enabled' >&2
            exit 1
          fi
          make -C "$work/openwrt" -j2 \
            package/base-files/compile \
            package/utils/busybox/compile \
            package/system/ubus/compile \
            package/system/uci/compile \
            package/network/services/dropbear/compile
          # OpenWrt's rules.mk places nonshared packages (e.g. Dropbear)
          # under bin/targets/<board>/<subtarget>/packages, while other
          # packages can live in bin/packages. Both are real build outputs.
          # Do not mistake a repository-path assumption for a compile failure.
          for pkg in busybox ubus uci dropbear; do
            if ! find "$work/openwrt/bin/packages" \
                "$work/openwrt/bin/targets/mediatek/mt6990/packages" \
                -type f \( -name "${pkg}-*.apk" -o -name "${pkg}_*.ipk" \) \
                -print -quit | grep -q .; then
              echo "Missing compiled OpenWrt package: $pkg" >&2
              find "$work/openwrt/bin" -type f \
                \( -name '*.apk' -o -name '*.ipk' \) -print | sort | tail -60 >&2
              exit 1
            fi
          done
          echo 'PUBLIC_MT6990_FIRST_BOOT_PACKAGES_BUILD_PASS'
          # OpenWrt package/install populates only a staging root directory.
          # Unlike target/install it cannot produce a device boot/flash image.
          # CONFIG_SIGNED_PACKAGES=n prevents package-index signing.
          make -C "$work/openwrt" -j1 package/install
          rootfs="$(find "$work/openwrt/build_dir" -maxdepth 3 \
            -type d -name 'root-mediatek' -print -quit)"
          test -n "$rootfs" && test -d "$rootfs"
          for executable in bin/busybox sbin/procd sbin/netifd \
                            sbin/ubusd sbin/uci usr/sbin/dropbear; do
            test -s "$rootfs/$executable" || {
              echo "Missing real staged rootfs executable: $executable" >&2
              exit 1
            }
          done
          # A generic OpenWrt root password may initially be empty. Lock it
          # in this ephemeral research stage; SSH must not autostart before
          # owner-specific public-key provisioning in a separate process.
          python3 - "$rootfs/etc/shadow" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          if not path.is_file() or path.is_symlink():
              raise SystemExit("No safe /etc/shadow in staged rootfs")
          lines = path.read_text().splitlines()
          found = 0
          for index, line in enumerate(lines):
              fields = line.split(":")
              if fields[0] == "root":
                  if len(fields) < 2:
                      raise SystemExit("Malformed root shadow record")
                  fields[1] = "!"
                  lines[index] = ":".join(fields)
                  found += 1
          if found != 1:
              raise SystemExit("Expected exactly one root shadow record")
          path.write_text("\n".join(lines) + "\n")
          print("SBAT6_ROOT_PASSWORD_LOCKED_IN_EPHEMERAL_STAGE")
          PY
          find "$rootfs/etc/rc.d" -maxdepth 1 -name '*dropbear*' \
            -type l -delete
          if find "$rootfs" -type f -path '*/lib/firmware/*' \
              -print -quit | grep -q .; then
            echo 'Unexpected firmware payload in rights-pending rootfs' >&2
            exit 1
          fi
          tar --sort=name --mtime='@0' --owner=0 --group=0 \
            --numeric-owner -C "$rootfs" -czf "$work/sbat6-rootfs-stage.tar.gz" .
          test -s "$work/sbat6-rootfs-stage.tar.gz"
          sha256sum "$work/sbat6-rootfs-stage.tar.gz"
          echo 'PUBLIC_MT6990_NONINSTALLABLE_ROOTFS_STAGE_BUILD_PASS'
          # Build an external diagnostic PID1 cpio with the SAME pinned
          # OpenWrt cross-toolchain as the native MT6990 kernel Image.
          # It is not a procd boot test or a device-installable image.
          # The previous native run built Image/rootfs successfully, then
          # failed silently in this new gate. Resolve only the actual MT6990
          # kernel directory and report each failed prerequisite explicitly.
          kernel="$work/openwrt/build_dir/target-aarch64_cortex-a55_musl/linux-mediatek_mt6990/linux-6.18.60"
          if ! test -s "$kernel/arch/arm64/boot/Image"; then
            echo "Missing native MT6990 Image at $kernel" >&2
            exit 1
          fi
          for required in CONFIG_ARCH_MEDIATEK=y CONFIG_BLK_DEV_INITRD=y; do
            if ! grep -qx "$required" "$kernel/.config"; then
              echo "Native kernel config lacks $required" >&2
              grep -E '^(# )?CONFIG_(ARCH_MEDIATEK|BLK_DEV_INITRD)' "$kernel/.config" >&2 || true
              exit 1
            fi
          done
          echo 'PUBLIC_MT6990_NATIVE_KERNEL_CONFIG_FOR_PID1_PASS'
          compiler="$(find "$work/openwrt/staging_dir" -maxdepth 4 \
            -name 'aarch64-openwrt-linux-musl-gcc' -print -quit)"
          if ! test -n "$compiler" || ! test -x "$compiler"; then
            echo 'Missing native OpenWrt AArch64 musl cross compiler' >&2
            find "$work/openwrt/staging_dir" -maxdepth 4 -name '*-gcc' -print >&2
            exit 1
          fi
          cross="$(dirname "$compiler")/aarch64-openwrt-linux-musl-"
          if ! test -x "${cross}ld"; then
            echo "Missing matching AArch64 linker: ${cross}ld" >&2
            exit 1
          fi
          echo 'PUBLIC_MT6990_NATIVE_PID1_TOOLCHAIN_READY'
          "$compiler" -nostdlib -ffreestanding -fno-builtin \
            -fno-stack-protector -fno-pic -static -O2 -no-pie \
            -Wl,-e,_start -Wl,--build-id=none \
            -o "$work/air6-init.elf" \
            "$GITHUB_WORKSPACE/scripts/air6-diagnostic-init.c"
          python3 - "$work/air6-init.elf" "$work/air6-initramfs.cpio" <<'PY'
          import importlib.util
          from pathlib import Path
          import sys
          spec = importlib.util.spec_from_file_location(
              "air6_cpio", Path("scripts/build-minimal-arm64-initramfs.py").resolve())
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          elf = Path(sys.argv[1]).read_bytes()
          mod.validate_elf(elf)
          raw = mod.make_archive(elf)
          assert raw.startswith(b"070701") and b"TRAILER!!!" in raw
          Path(sys.argv[2]).write_bytes(raw)
          print("PUBLIC_MT6990_NATIVE_DIAGNOSTIC_PID1_CPIO_BUILD_PASS")
          PY
          test -s "$work/air6-initramfs.cpio"
          # Reuse the exact public GPL-labelled MT6990 DTS inputs already
          # compiled by arm64-image-build.yml. Rights review stays pending.
          donor=https://raw.githubusercontent.com/13179415360/openwrt-mt6990-lg6851f/a40df9a5afb46716dea799acea69f17480df4d82
          fetch_checked() {
            local url="$1" dest="$2" expected="$3"
            curl --fail --silent --show-error --location --retry 3 \
              --max-time 90 "$url" -o "$dest"
            test "$(git hash-object "$dest")" = "$expected" || {
              echo "Pinned MT6990 DT input mismatch: $dest" >&2; exit 1;
            }
          }
          test ! -e "$kernel/arch/arm64/boot/dts/mediatek/mt6990.dtsi"
          fetch_checked "$donor/target/linux/mediatek/patches-6.18/969-arm64-dts-mediatek-add-mt6990-soc.patch" \
            "$work/mt6990-soc.patch" 4f24ec8183c5495a312ec5f1109164d7b770a770
          mkdir -p "$kernel/include/dt-bindings/clock" "$kernel/include/dt-bindings/power"
          fetch_checked "$donor/target/linux/mediatek/files-6.18/include/dt-bindings/clock/mt6990-clk.h" \
            "$kernel/include/dt-bindings/clock/mt6990-clk.h" eea7fbe58a5d5b7357c5ddb83eff6ffb74b3801a
          fetch_checked "$donor/target/linux/mediatek/files-6.18/include/dt-bindings/power/mt6990-power.h" \
            "$kernel/include/dt-bindings/power/mt6990-power.h" c221b322fb437683d052ec4241a33afaecb33979
          python3 - "$work/mt6990-soc.patch" "$kernel/arch/arm64/boot/dts/mediatek/mt6990.dtsi" <<'PY'
          from pathlib import Path
          import sys
          lines = Path(sys.argv[1]).read_text().splitlines()
          start = next((i for i, s in enumerate(lines) if s.startswith("@@ -0,0 +1,")), None)
          if start is None:
              raise SystemExit("Pinned MT6990 SoC patch lacks expected new-file hunk")
          body = [s[1:] for s in lines[start + 1:] if s.startswith("+")]
          if len(body) < 400 or not body[0].startswith("// SPDX-License-Identifier:"):
              raise SystemExit("Unexpected MT6990 SoC DTSI")
          Path(sys.argv[2]).write_text("\n".join(body) + "\n")
          PY
          for dts in mt6990-air-terminal-6.dts mt6990-air-terminal-6-ethernet-test.dts; do
            test ! -e "$kernel/arch/arm64/boot/dts/mediatek/$dts"
            cp "$GITHUB_WORKSPACE/board/$dts" \
              "$kernel/arch/arm64/boot/dts/mediatek/$dts"
          done
          cat >> "$kernel/arch/arm64/boot/dts/mediatek/Makefile" <<'EOF'
          # Air6 compile-only candidate DTBs, not device image recipes.
          dtb-$(CONFIG_ARCH_MEDIATEK) += mt6990-air-terminal-6.dtb
          dtb-$(CONFIG_ARCH_MEDIATEK) += mt6990-air-terminal-6-ethernet-test.dtb
          EOF
          PATH="$(dirname "$compiler"):$PATH" timeout 1200s \
            make -C "$kernel" ARCH=arm64 CROSS_COMPILE="$cross" -j2 dtbs
          for dtb in mt6990-air-terminal-6.dtb mt6990-air-terminal-6-ethernet-test.dtb; do
            dtbpath="$kernel/arch/arm64/boot/dts/mediatek/$dtb"
            test -s "$dtbpath"
            python3 - "$dtbpath" <<'PY'
          from pathlib import Path
          import sys
          blob = Path(sys.argv[1]).read_bytes()
          assert blob[:4] == bytes.fromhex("d00dfeed"), "not a DTB"
          assert b"softbank,air-terminal-6\x00" in blob
          assert b"mediatek,mt7531\x00" in blob
          print("PUBLIC_MT6990_NATIVE_AIR6_DTB_CONTENT_PASS", sys.argv[1])
          PY
          done
          sha256sum "$kernel/arch/arm64/boot/Image" \
            "$kernel/arch/arm64/boot/dts/mediatek/mt6990-air-terminal-6.dtb" \
            "$kernel/arch/arm64/boot/dts/mediatek/mt6990-air-terminal-6-ethernet-test.dtb" \
            "$work/air6-initramfs.cpio"
          echo 'PUBLIC_MT6990_SAME_OPENWRT_KERNEL_IMAGE_AIR6_DTBS_PID1_BUILD_PASS'
          echo 'LIMIT: external diagnostic PID1, no procd boot; DTB driver/clock/genpd/radio not integrated'
          # Material next stage: archive the ACTUAL OpenWrt package/install
          # rootfs as a procd-PID1 initramfs, not the freestanding diagnostic
          # ELF. It shares the native kernel toolchain/package build above.
          # No target/install, image recipe, signing, upload or device access.
          python3 - "$rootfs" "$work/air6-procd-initramfs.cpio" <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          import stat
          import struct
          import sys

          root, output = Path(sys.argv[1]), Path(sys.argv[2])
          if not root.is_dir() or root.is_symlink() or output.exists():
              raise SystemExit("Unsafe procd initramfs staging paths")
          for name in ("sbin/procd", "sbin/netifd", "sbin/ubusd",
                       "bin/busybox", "etc/shadow", "lib/ld-musl-aarch64.so.1"):
              path = root / name
              if not path.exists() or not path.is_file():
                  raise SystemExit("Missing procd runtime dependency: " + name)
          init = root / "sbin/init"
          if not init.is_symlink() and not init.is_file():
              raise SystemExit("Native rootfs lacks /sbin/init (procd PID1)")
          if init.is_symlink() and os.readlink(init) not in (
                  "procd", "/sbin/procd", "sbin/procd"):
              raise SystemExit("Unexpected /sbin/init link: " + os.readlink(init))
          if (root / "init").exists() or (root / "init").is_symlink():
              raise SystemExit("Refusing to overwrite existing /init")
          for name in ("sbin/procd", "sbin/netifd", "sbin/ubusd"):
              blob = (root / name).read_bytes()[:64]
              if (blob[:6] != b"\\x7fELF\\x02\\x01"
                      or struct.unpack_from("<H", blob, 18)[0] != 183):
                  raise SystemExit("Non-AArch64 native executable: " + name)
          shadow = (root / "etc/shadow").read_text().splitlines()
          if sum(line.startswith("root:!:") for line in shadow) != 1:
              raise SystemExit("root password is not locked")
          if any((root / "etc/rc.d").glob("*dropbear*")):
              raise SystemExit("Dropbear autostart is not disabled")
          if any((root / "lib/firmware").rglob("*")) if (
                  root / "lib/firmware").exists() else False:
              raise SystemExit("Radio firmware unexpectedly present")
          spec = importlib.util.spec_from_file_location(
              "air6_newc", Path("scripts/build-minimal-arm64-initramfs.py").resolve())
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          entries = {}
          for path in root.rglob("*"):
              name = path.relative_to(root).as_posix()
              info = path.lstat()
              if stat.S_ISDIR(info.st_mode):
                  payload = b""
              elif stat.S_ISLNK(info.st_mode):
                  payload = os.fsencode(os.readlink(path))
              elif stat.S_ISREG(info.st_mode):
                  payload = path.read_bytes()
              else:
                  raise SystemExit("Unsupported rootfs special file: " + name)
              entries[name] = (info.st_mode, payload, 0, 0)
          for name in ("dev", "proc", "sys"):
              entries.setdefault(name, (stat.S_IFDIR | 0o755, b"", 0, 0))
          for name, major, minor, perms in (
                  ("dev/console", 5, 1, 0o600), ("dev/null", 1, 3, 0o666)):
              entries.setdefault(name, (stat.S_IFCHR | perms, b"", major, minor))
          entries["init"] = (stat.S_IFLNK | 0o777, b"sbin/init", 0, 0)
          archive = bytearray()
          for ino, name in enumerate(sorted(entries), 1):
              mode, payload, major, minor = entries[name]
              archive += mod.newc_entry(name, mode, payload, ino, major, minor)
          archive += mod.newc_entry("TRAILER!!!", 0, ino=len(entries) + 1)
          if len(archive) > 256 * 1024 * 1024:
              raise SystemExit("Procd initramfs exceeds 256 MiB safety limit")
          output.write_bytes(archive)
          print("PUBLIC_MT6990_NATIVE_PROCD_PID1_INITRAMFS_BUILD_PASS",
                "entries=" + str(len(entries)), "bytes=" + str(len(archive)))
          PY
          test -s "$work/air6-procd-initramfs.cpio"
          sha256sum "$work/air6-procd-initramfs.cpio"
          echo 'LIMIT: procd rootfs archive is not embedded or QEMU/device boot tested'
          echo 'LIMIT: no device boot, signing, installable image, private material or rights approval'
