name: MT6990 OpenWrt native subtarget and package build
on:
  pull_request:
    paths:
      - tools/build/mt6990-target/**
      - tools/build/stage_mt6990_subtarget.py
      - scripts/stage-native-mt6990-phy-ifrao.sh
      - patches/mt6990/0002-air6-avoid-sgmii-top-cycle.patch
      - patches/mt6990/0003-air6-check-sgmii-pll-errors.patch
      - tests/test_mt6990_native_subtarget.py
      - tools/build/install_p44_extension.py
      - tests/test_install_p44_extension.py
      - tools/build/pack_p26_rootfs.py
      - tools/build/verify_p26_independent.py
      - tests/test_pack_p26_rootfs.py
      - tests/test_verify_p26_independent.py
      - tests/test_air6_first_stage_contract.py
      - tests/test_build_air6_first_stage.py
      - tests/test_prepare_p44_state.py
      - tests/test_publication_gate.py
      - tools/security/check_publication.py
      - tools/boot/air6_first_stage.sh
      - tools/boot/prepare_p44_state.sh
      - tools/boot/verify_bound_p26.sh
      - tools/build/build_air6_first_stage.py
      - config/source-catalog.json
      - .github/workflows/mt6990-native-subtarget.yml
permissions:
  contents: read
jobs:
  native-defconfig:
    name: Real upstream OpenWrt make defconfig (no firmware)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test staging logic and source identity
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_mt6990_native_subtarget.py' -v
          python3 -m unittest discover -s tests -p 'test_air6_first_stage_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_build_air6_first_stage.py' -v
          python3 -m unittest discover -s tests -p 'test_prepare_p44_state.py' -v
          python3 -m unittest discover -s tests -p 'test_publication_gate.py' -v
          python3 tools/build/verify_source_catalog.py
          python3 tools/security/check_publication.py
      - name: Pin clean upstream OpenWrt and register noninstallable target
        shell: bash
        run: |
          set -euo pipefail
          pin=5799d2da76998be50432b0a3325b42713b4b619b
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          git clone --quiet --no-checkout --filter=blob:none \
            https://github.com/openwrt/openwrt.git "$work/openwrt"
          git -C "$work/openwrt" fetch --quiet --depth=1 origin "$pin"
          git -C "$work/openwrt" checkout --quiet --detach "$pin"
          test "$(git -C "$work/openwrt" rev-parse HEAD)" = "$pin"
          python3 tools/build/stage_mt6990_subtarget.py \
            --tree "$work/openwrt" --report "$work/mt6990-source-report.json"
          python3 - "$work/mt6990-source-report.json" <<'PY'
          import json, sys
          from pathlib import Path
          result = json.loads(Path(sys.argv[1]).read_text())
          assert result["status"] == "MT6990_NATIVE_OPENWRT_SOURCE_SUBTARGET_STAGED"
          assert result["upstream_openwrt_commit"] == "5799d2da76998be50432b0a3325b42713b4b619b"
          assert result["signed"] is False and result["firmware_outputs"] == "NONE"
          print("PUBLIC_MT6990_SOURCE_REGISTRATION_PASS")
          PY
          cat > "$work/openwrt/.config" <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_mt6990=y
          EOF
          # Native OpenWrt target validation requires umask 022.
          umask 022
          make -C "$work/openwrt" defconfig
          grep -qx 'CONFIG_TARGET_mediatek_mt6990=y' "$work/openwrt/.config"
          # The kernel-less package gate must not inherit MediaTek GPIO/LED
          # modules or generic router offload modules from parent defaults.
          for pkg in kmod-gpio-button-hotplug kmod-leds-gpio kmod-nft-offload; do
            if grep -qE "^CONFIG_PACKAGE_${pkg}=[ym]$" "$work/openwrt/.config"; then
              echo "Unexpected kernel-coupled default in userspace-only build: $pkg" >&2
              exit 1
            fi
          done
          test -s "$work/openwrt/target/linux/mediatek/mt6990/config-6.18"
          test -s "$work/openwrt/target/linux/mediatek/mt6990/target.mk"
          ! grep -qE '^[[:space:]]*define Device/' \
            "$work/openwrt/target/linux/mediatek/image/mt6990.mk"
          echo 'PUBLIC_MT6990_REAL_OPENWRT_DEFCONFIG_PASS'
          echo 'NO_DEVICE_PROFILE_NO_FIRMWARE_NO_SIGNING_NO_HARDWARE'

  native-package-compile:
    name: Compile real OpenWrt procd/netifd packages (noninstallable)
    needs: native-defconfig
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build pinned native MT6990 userspace package closure
        shell: bash
        run: |
          set -euo pipefail
          pin=5799d2da76998be50432b0a3325b42713b4b619b
          work="$(mktemp -d)"
          trap 'rm -rf -- "$work"' EXIT
          git clone --quiet --no-checkout --filter=blob:none \
            https://github.com/openwrt/openwrt.git "$work/openwrt"
          git -C "$work/openwrt" fetch --quiet --depth=1 origin "$pin"
          git -C "$work/openwrt" checkout --quiet --detach "$pin"
          test "$(git -C "$work/openwrt" rev-parse HEAD)" = "$pin"
          python3 tools/build/stage_mt6990_subtarget.py \
            --tree "$work/openwrt" --report "$work/staging-report.json"
          cat > "$work/openwrt/.config" <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_mt6990=y
          CONFIG_PACKAGE_busybox=y
          CONFIG_PACKAGE_procd=y
          CONFIG_PACKAGE_ubus=y
          CONFIG_PACKAGE_uci=y
          CONFIG_PACKAGE_netifd=y
          CONFIG_PACKAGE_dropbear=y
          # CONFIG_SIGNED_PACKAGES is not set
          EOF
          umask 022
          make -C "$work/openwrt" defconfig
          grep -qx 'CONFIG_TARGET_mediatek_mt6990=y' "$work/openwrt/.config"
          # The kernel-less package gate must not inherit MediaTek GPIO/LED
          # modules or generic router offload modules from parent defaults.
          for pkg in kmod-gpio-button-hotplug kmod-leds-gpio kmod-nft-offload; do
            if grep -qE "^CONFIG_PACKAGE_${pkg}=[ym]$" "$work/openwrt/.config"; then
              echo "Unexpected kernel-coupled default in userspace-only build: $pkg" >&2
              exit 1
            fi
          done
          for pkg in busybox procd ubus uci netifd dropbear; do
            grep -qx "CONFIG_PACKAGE_${pkg}=y" "$work/openwrt/.config" || {
              echo "Missing selected native package: $pkg" >&2
              exit 1
            }
          done
          # Build OpenWrt's actual host tools, cross-toolchain and target
          # packages; no target/install, image recipe, signer or flash step.
          make -C "$work/openwrt" -j2 tools/install
          make -C "$work/openwrt" -j2 toolchain/install
          # The actual OpenWrt procd dependency closure reaches package/kernel/linux
          # even without selected kmod defaults. Build the native MT6990 kernel
          # first rather than hiding or bypassing its dependency. This is still
          # a generic source-stage Image, NOT an Air6-matched DTS/AP firmware.
          # Preserve the actual Kbuild failure in hosted logs if a choice or
          # driver dependency still blocks the matching native kernel.
          make -C "$work/openwrt" -j2 V=s target/linux/compile
          if ! find "$work/openwrt/build_dir" -type f \
              -path '*/linux-mediatek_mt6990/linux-*/arch/arm64/boot/Image' \
              -size +0c -print -quit | grep -q .; then
            echo "Native MT6990 kernel Image was not produced" >&2
            exit 1
          fi
          echo 'PUBLIC_MT6990_NATIVE_KERNEL_IMAGE_BUILD_PASS'
          # Now build the real package dependency closure with matching
          # OpenWrt kernel headers/modules metadata. No target/install.
          make -C "$work/openwrt" -j2 \
            package/system/procd/compile \
            package/network/config/netifd/compile
          package_dir="$work/openwrt/bin/packages"
          test -d "$package_dir"
          for pkg in procd netifd; do
            if ! find "$package_dir" -type f \
                \( -name "${pkg}-*.apk" -o -name "${pkg}_*.ipk" \) \
                -print -quit | grep -q .; then
              echo "Missing actual compiled OpenWrt package: $pkg" >&2
              exit 1
            fi
          done
          echo 'PUBLIC_MT6990_REAL_OPENWRT_PROCD_NETIFD_PACKAGES_PASS'
          echo 'NONINSTALLABLE_PACKAGES_ONLY_NO_DEVICE_PROFILE_NO_SIGNING'
          # Close the next material gap: compile the actual first-boot tools
          # from the same pinned OpenWrt toolchain, not a synthetic rootfs.
          # Do NOT run target/install, build a Device profile or sign an index.
          if grep -q '^CONFIG_SIGNED_PACKAGES=y$' "$work/openwrt/.config"; then
            echo 'Package signing unexpectedly enabled' >&2
            exit 1
          fi
          make -C "$work/openwrt" -j2 \
            package/base-files/compile \
            package/utils/busybox/compile \
            package/system/ubus/compile \
            package/system/uci/compile \
            package/network/services/dropbear/compile
          # OpenWrt's rules.mk places nonshared packages (e.g. Dropbear)
          # under bin/targets/<board>/<subtarget>/packages, while other
          # packages can live in bin/packages. Both are real build outputs.
          # Do not mistake a repository-path assumption for a compile failure.
          for pkg in busybox ubus uci dropbear; do
            if ! find "$work/openwrt/bin/packages" \
                "$work/openwrt/bin/targets/mediatek/mt6990/packages" \
                -type f \( -name "${pkg}-*.apk" -o -name "${pkg}_*.ipk" \) \
                -print -quit | grep -q .; then
              echo "Missing compiled OpenWrt package: $pkg" >&2
              find "$work/openwrt/bin" -type f \
                \( -name '*.apk' -o -name '*.ipk' \) -print | sort | tail -60 >&2
              exit 1
            fi
          done
          echo 'PUBLIC_MT6990_FIRST_BOOT_PACKAGES_BUILD_PASS'
          # OpenWrt package/install populates only a staging root directory.
          # Unlike target/install it cannot produce a device boot/flash image.
          # CONFIG_SIGNED_PACKAGES=n prevents package-index signing.
          # OpenWrt package ownership must be captured at install time, not
          # reconstructed by blanket chown after staging. Keep fakeroot's
          # inode metadata in this ephemeral job for packing and verification.
          command -v fakeroot >/dev/null || { echo 'P26_BLOCKED_FAKEROOT_UNAVAILABLE' >&2; exit 1; }
          # The previous native run failed inside package/install with only
          # OpenWrt's generic make error. Preserve the real first failing
          # command and stderr in this same run; do not retry a blind build.
          # OpenWrt invokes host fakeroot inside package/install. Reuse the
          # outer fakeroot daemon so APK ownership metadata survives for p26.
          host_fakeroot="$work/openwrt/staging_dir/host/bin/fakeroot"
          test -x "$host_fakeroot"
          mv "$host_fakeroot" "$host_fakeroot.original"
          cat > "$host_fakeroot" <<'FAKEROOT_WRAPPER'
          #!/bin/sh
          if [ -n "${FAKEROOTKEY:-}" ]; then
            # OpenWrt may invoke fakeroot with -i/-s state options. The
            # outer daemon already owns this metadata, so strip only known
            # fakeroot options before executing the nested command.
            while [ "$#" -gt 0 ]; do
              case "$1" in
                -i|-s|-b) [ "$#" -ge 2 ] || exit 2; shift 2 ;;
                -u|-l) shift ;;
                --) shift; break ;;
                -*) echo "P26_BLOCKED_FAKEROOT_WRAPPER_UNKNOWN_OPTION: $1" >&2; exit 2 ;;
                *) break ;;
              esac
            done
            [ "$#" -gt 0 ] || { echo "P26_BLOCKED_FAKEROOT_WRAPPER_NO_COMMAND" >&2; exit 2; }
            exec "$@"
          fi
          exec "${0}.original" "$@"
          FAKEROOT_WRAPPER
          chmod 0755 "$host_fakeroot"
          fakeroot -s "$work/p26-fakeroot.state" -- make -C "$work/openwrt" -j1 V=s package/install
          mv "$host_fakeroot.original" "$host_fakeroot"
          test -s "$work/p26-fakeroot.state"
          rootfs="$(find "$work/openwrt/build_dir" -maxdepth 3 \
            -type d -name 'root-mediatek' -print -quit)"
          test -n "$rootfs" && test -d "$rootfs"
          for executable in bin/busybox sbin/procd sbin/netifd \
                            sbin/ubusd sbin/uci usr/sbin/dropbear; do
            test -s "$rootfs/$executable" || {
              echo "Missing real staged rootfs executable: $executable" >&2
              exit 1
            }
          done
          # A generic OpenWrt root password may initially be empty. Lock it
          # in this ephemeral research stage; SSH must not autostart before
          # owner-specific public-key provisioning in a separate process.
          # Re-enter the saved package/install fakeroot metadata namespace for
          # the shadow edit. Writing outside fakeroot can replace the inode and
          # lose the target UID/GID tracked by the package installer.
          fakeroot -i "$work/p26-fakeroot.state" -s "$work/p26-fakeroot.state" -- python3 - "$rootfs/etc/shadow" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          if not path.is_file() or path.is_symlink():
              raise SystemExit("No safe /etc/shadow in staged rootfs")
          lines = path.read_text().splitlines()
          found = 0
          for index, line in enumerate(lines):
              fields = line.split(":")
              if fields[0] == "root":
                  if len(fields) < 2:
                      raise SystemExit("Malformed root shadow record")
                  fields[1] = "!"
                  lines[index] = ":".join(fields)
                  found += 1
          if found != 1:
              raise SystemExit("Expected exactly one root shadow record")
          # Preserve the installed inode: pathlib.write_text() truncates in place,
          # but use an explicit descriptor to avoid accidental replacement during
          # future refactors. Fakeroot metadata is keyed to this inode.
          with path.open("r+", encoding="utf-8") as handle:
              handle.seek(0)
              handle.write("\n".join(lines) + "\n")
              handle.truncate()
          print("SBAT6_ROOT_PASSWORD_LOCKED_IN_EPHEMERAL_STAGE")
          PY
          # Install public RC14-derived, noncritical P44 extension hook
          # in the SAME target fakeroot metadata namespace as package/install.
          fakeroot -i "$work/p26-fakeroot.state" -s "$work/p26-fakeroot.state" -- \
            python3 "$GITHUB_WORKSPACE/tools/build/install_p44_extension.py" "$rootfs"
          sh -n "$rootfs/etc/init.d/air6-p44-extension"
          sh -n "$rootfs/usr/libexec/air6/p44-extension-runner"
          # Verify the real, fakeroot-tracked installed hook, not only
          # synthetic installer tests. All paths must survive P26 readback.
          fakeroot -i "$work/p26-fakeroot.state" -- python3 - "$rootfs" <<'PY'
          import os
          from pathlib import Path
          import stat
          import sys
          root = Path(sys.argv[1])
          expected = {
              "etc/init.d/air6-p44-extension": 0o755,
              "usr/libexec/air6/p44-extension-runner": 0o755,
          }
          for rel, mode in expected.items():
              node = root / rel
              meta = node.lstat()
              if (not stat.S_ISREG(meta.st_mode)
                      or meta.st_uid != 0 or meta.st_gid != 0
                      or stat.S_IMODE(meta.st_mode) != mode):
                  raise SystemExit("P26_BLOCKED_P44_HOOK_METADATA_" +
                                   rel.replace("/", "_"))
          service = root / "etc/rc.d/S99air6-p44-extension"
          if (not service.is_symlink()
                  or os.readlink(service) != "../init.d/air6-p44-extension"
                  or service.resolve() != (root / "etc/init.d/air6-p44-extension").resolve()):
              raise SystemExit("P26_BLOCKED_P44_INIT_LINK")
          runner = (root / "usr/libexec/air6/p44-extension-runner").read_text()
          required = (' /overlay ext4 ', '"$base/enabled"', '"$base/disabled"',
                      'timeout 15 "$script"', 'extension exit status=$status')
          if not all(token in runner for token in required):
              raise SystemExit("P26_BLOCKED_P44_HOOK_CONTRACT")
          for rel in ("overlay/air6/enabled", "overlay/air6/boot.sh",
                      "overlay/air6/disabled"):
              if (root / rel).exists() or (root / rel).is_symlink():
                  raise SystemExit("P26_BLOCKED_PREACTIVATED_P44_EXTENSION")
          print("PUBLIC_P26_P44_HOOK_STAGED_ROOT_METADATA_PASS")
          PY
          python3 -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p test_install_p44_extension.py -v
          find "$rootfs/etc/rc.d" -maxdepth 1 -name '*dropbear*' \
            -type l -delete
          if find "$rootfs" -type f -path '*/lib/firmware/*' \
              -print -quit | grep -q .; then
            echo 'Unexpected firmware payload in rights-pending rootfs' >&2
            exit 1
          fi
          # Exercise actual native OpenWrt procd -> ubus -> netifd -> Linux
          # bridge in the SAME native Image on isolated QEMU virt. Stage the
          # already reviewed research-only boot policy in this ephemeral
          # rootfs; the source tree and package archives remain untouched.
          # No NIC, DHCP server, NAT, SSH listener, credentials or radio.
          test ! -e "$rootfs/etc/rc.d/S10netifd"
          test ! -L "$rootfs/etc/rc.d/S10netifd"
          test ! -L "$rootfs/etc/config/network"
          install -D -m 0755 "$GITHUB_WORKSPACE/config/sbat6-stage/etc/rc.d/S10netifd" \
            "$rootfs/etc/rc.d/S10netifd"
          install -D -m 0644 "$GITHUB_WORKSPACE/config/sbat6-stage/etc/config/network" \
            "$rootfs/etc/config/network"
          test -x "$rootfs/etc/rc.d/S10netifd"
          grep -Fq "config interface 'loopback'" "$rootfs/etc/config/network"
          echo 'PUBLIC_MT6990_NATIVE_QEMU_NETIFD_BRIDGE_BOOT_POLICY_STAGED'
          tar --sort=name --mtime='@0' --owner=0 --group=0 \
            --numeric-owner -C "$rootfs" -czf "$work/sbat6-rootfs-stage.tar.gz" .
          test -s "$work/sbat6-rootfs-stage.tar.gz"
          sha256sum "$work/sbat6-rootfs-stage.tar.gz"
          echo 'PUBLIC_MT6990_NONINSTALLABLE_ROOTFS_STAGE_BUILD_PASS'
          # Same-run provenance is generated from the actual installed APK database.
          # This is a private intermediate receipt, not proof of p26 manufacture.
          python3 - "$rootfs" "$work" "$pin" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sys
          root, work, pin = Path(sys.argv[1]), Path(sys.argv[2]), sys.argv[3]
          database = root / "lib/apk/db/installed"
          if not database.is_file() or database.is_symlink():
              raise SystemExit("P26_BLOCKED_REAL_INSTALLED_PACKAGE_DB_MISSING")
          raw = database.read_bytes()
          if not raw:
              raise SystemExit("P26_BLOCKED_EMPTY_INSTALLED_PACKAGE_DB")
          packages = sorted(set(
              line[2:].strip() for line in raw.decode("utf-8").splitlines()
              if line.startswith("P:") and line[2:].strip()
          ))
          required = {"base-files", "busybox", "procd", "ubus", "uci",
                      "netifd", "dropbear"}
          if not required.issubset(packages):
              raise SystemExit("P26_BLOCKED_INSTALLED_PACKAGE_INVENTORY_INCOMPLETE:"
                               + ",".join(sorted(required - set(packages))))
          record = {
              "openwrt_commit": pin,
              "source_built": True,
              "package_install": True,
              "packages": packages,
              "feeds": {},
              "installed_db_sha256": hashlib.sha256(raw).hexdigest(),
              "workflow_checkout_sha": __import__("os").environ["GITHUB_SHA"],
              "provenance_scope": "SAME_RUN_EPHEMERAL_NATIVE_PACKAGE_INSTALL",
          }
          (work / "p26-source-receipt.json").write_text(
              json.dumps(record, sort_keys=True, indent=2) + "\n")
          print("P26_SAME_RUN_PACKAGE_INSTALL_RECEIPT_READY",
                len(packages), record["installed_db_sha256"])
          PY
          # Produce an ephemeral real p26 from THIS job's actual package/install
          # root, then independently read back its full 128 MiB and filesystem.
          # No Actions artifact, cache, release, signing, or device interaction.
          # Extract Ubuntu's packaged squashfs-tools without root privileges.
          # Reuse native tools if present; keep all binaries inside this job.
          if ! command -v mksquashfs >/dev/null || ! command -v unsquashfs >/dev/null; then
            mkdir -p "$work/squashfs-deb" "$work/squashfs-tools"
            (cd "$work/squashfs-deb" && apt download squashfs-tools)
            deb="$(find "$work/squashfs-deb" -maxdepth 1 -name 'squashfs-tools_*.deb' -print -quit)"
            test -n "$deb" && test -s "$deb"
            dpkg-deb -x "$deb" "$work/squashfs-tools"
            export PATH="$work/squashfs-tools/usr/bin:$PATH"
          fi
          command -v mksquashfs
          command -v unsquashfs
          test -x "$GITHUB_WORKSPACE/tools/build/pack_p26_rootfs.py" || \
            test -f "$GITHUB_WORKSPACE/tools/build/pack_p26_rootfs.py"
          install -d -m 0700 "$work/private-p26"
          fakeroot -i "$work/p26-fakeroot.state" -- python3 "$GITHUB_WORKSPACE/tools/build/pack_p26_rootfs.py" \
            --rootfs "$rootfs" \
            --source-receipt "$work/p26-source-receipt.json" \
            --output "$work/private-p26/packed"
          test "$(stat -c %s "$work/private-p26/packed/rootfs_a.p26")" -eq 134217728
          fakeroot -i "$work/p26-fakeroot.state" -- python3 "$GITHUB_WORKSPACE/tools/build/verify_p26_independent.py" \
            --rootfs "$rootfs" \
            --p26 "$work/private-p26/packed/rootfs_a.p26" \
            --squashfs "$work/private-p26/packed/rootfs.squashfs" \
            --producer-receipt "$work/private-p26/packed/p26-receipt.json" \
            --attestation "$work/private-p26/packed/p26-independent-attestation.json"
          python3 - "$work/private-p26/packed/p26-receipt.json" \
            "$work/private-p26/packed/p26-independent-attestation.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          producer, independent = (json.loads(Path(p).read_text()) for p in sys.argv[1:])
          if (producer["p26_sha256"] != independent["p26_sha256"]
                  or producer["status"] != "P26_PACKED_AWAIT_INDEPENDENT_FS_READBACK"
                  or independent["status"] != "P26_INDEPENDENT_FS_READBACK_VERIFIED"):
              raise SystemExit("P26_BLOCKED_ATTESTATION_MISMATCH")
          print("PUBLIC_P26_PRODUCER_AND_INDEPENDENT_RECEIPT_IDENTITY_PASS",
                independent["p26_sha256"])
          PY
          echo 'PUBLIC_MT6990_REAL_SOURCE_BUILT_P26_INDEPENDENT_READBACK_PASS'
          echo 'LIMIT: ephemeral unsigned p26 only; no physical boot, Wi-Fi, signing or distribution'
          # Keep a concise, non-binary manufacture receipt in the Actions
          # summary. Never upload/cache the image or the full producer receipts.
          python3 - "$work/private-p26/packed/p26-receipt.json" \
            "$work/private-p26/packed/p26-independent-attestation.json" \
            "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys
          producer, independent = (json.loads(Path(p).read_text()) for p in sys.argv[1:3])
          if (not isinstance(producer.get("p26_sha256"), str)
                  or not re.fullmatch(r"[0-9a-f]{64}", producer["p26_sha256"])
                  or producer.get("p26_sha256") != independent.get("p26_sha256")
                  or producer.get("partition_bytes") != 134217728
                  or independent.get("partition_bytes") != 134217728
                  or type(producer.get("squashfs_bytes")) is not int
                  or producer["squashfs_bytes"] <= 0
                  or independent.get("status") != "P26_INDEPENDENT_FS_READBACK_VERIFIED"):
              raise SystemExit("P26 summary identity gate failed")
          summary = Path(sys.argv[3])
          with summary.open("a", encoding="utf-8") as stream:
              stream.write("## Unsigned Air6 source-build receipt\n\n")
              stream.write("| Item | Result |\n|---|---|\n")
              stream.write(f"| P26 | {producer['partition_bytes']} bytes; SHA-256 `{producer['p26_sha256']}` |\n")
