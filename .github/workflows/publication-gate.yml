name: Publication safety gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout (no credentials retained)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate GitHub Actions YAML syntax
        run: |
          python3 -m pip install --quiet --break-system-packages PyYAML
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          for path in sorted(Path('.github/workflows').glob('*.yml')):
              data = yaml.safe_load(path.read_text())
              assert isinstance(data, dict), f'{path}: workflow must be a mapping'
              assert isinstance(data.get('jobs'), dict), f'{path}: missing jobs'
              print('YAML OK:', path)
          PY
      - name: Check workflow shell block syntax
        run: python3 tools/check_workflow_shell.py
      - name: Python syntax check
        run: python3 -m py_compile scripts/check-publication.py
      - name: Publication gate unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Compile and test standalone FE reference logic
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            examples/fe-recovery/test_fe_recovery.c -o /tmp/t6-fe-reference-test
          /tmp/t6-fe-reference-test
      - name: Install Device Tree compiler
        run: sudo apt-get update && sudo apt-get install -y device-tree-compiler
      - name: Compile disabled DT experiment
        run: bash scripts/check-dtso.sh
      - name: Verify disabled overlay merge on synthetic base
        run: bash scripts/verify-overlay-offline.sh
      - name: Validate synthetic SGMII phandle resolution
        run: bash scripts/check-sgmii-linked-fixture.sh
      - name: Validate board evidence
        run: python3 tools/validate_board_evidence.py
      - name: Static publication gate
        run: python3 scripts/check-publication.py
      - name: Screen reachable git history (read only)
        run: python3 scripts/check-publication-history.py
      - name: Publication gate diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo '## Publication safety gate'
            echo "Commit: \`${GITHUB_SHA}\`"
            echo 'Tests and checks above are independently required; consult each failed step.'
            echo 'This gate is not a complete license or secret-history certification.'
            echo 'A PASS does not authorize flashing or firmware release.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate documented files exist
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md BUILDING.md INSTALL.md RECOVERY.md SECURITY.md RELEASE-READINESS.md \
                      LICENSES/README.md CONTRIBUTING.md PUBLICATION-CHECKLIST.md \
                      docs/SOURCE-AUDIT.md; do
            test -s "$file"
          done
