name: RFC MediaTek patch apply check

on:
  push:
    paths:
      - 'patches/rfc/0001-mediatek-quiesce-workers-before-cleanup.patch'
      - 'patches/rfc/0002-mediatek-serialize-reset-requeue.patch'
      - '.github/workflows/rfc-mediatek-patch.yml'
  pull_request:
    paths:
      - 'patches/rfc/0001-mediatek-quiesce-workers-before-cleanup.patch'
      - 'patches/rfc/0002-mediatek-serialize-reset-requeue.patch'
      - '.github/workflows/rfc-mediatek-patch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned upstream Linux v6.18 source file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream/drivers/net/ethernet/mediatek
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/torvalds/linux/v6.18/drivers/net/ethernet/mediatek/mtk_eth_soc.c \
            -o upstream/drivers/net/ethernet/mediatek/mtk_eth_soc.c
          test "$(git hash-object upstream/drivers/net/ethernet/mediatek/mtk_eth_soc.c)" = e68997a29191b2a8ce0868873dcfe95c79e10e56
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/torvalds/linux/v6.18/drivers/net/ethernet/mediatek/mtk_eth_soc.h \
            -o upstream/drivers/net/ethernet/mediatek/mtk_eth_soc.h
          test "$(git hash-object upstream/drivers/net/ethernet/mediatek/mtk_eth_soc.h)" = 0168e2fbc6197a6aa9fe159767166e86915accbc
      - name: Check and apply RFC to real upstream source
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream init -q
          git -C upstream add drivers/net/ethernet/mediatek/mtk_eth_soc.c drivers/net/ethernet/mediatek/mtk_eth_soc.h
          git -C upstream -c user.name='RFC check' -c user.email='noreply@example.invalid' commit -qm 'Pinned Linux v6.18 files'
          git -C upstream apply --check "$GITHUB_WORKSPACE/patches/rfc/0001-mediatek-quiesce-workers-before-cleanup.patch"
          git -C upstream apply "$GITHUB_WORKSPACE/patches/rfc/0001-mediatek-quiesce-workers-before-cleanup.patch"
          git -C upstream apply --check "$GITHUB_WORKSPACE/patches/rfc/0002-mediatek-serialize-reset-requeue.patch"
          git -C upstream apply "$GITHUB_WORKSPACE/patches/rfc/0002-mediatek-serialize-reset-requeue.patch"
          python3 tools/check_mediatek_rfc_series.py --source upstream
          git -C upstream diff --check
