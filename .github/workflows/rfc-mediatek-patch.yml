name: RFC MediaTek patch apply check

on:
  push:
    paths:
      - 'patches/rfc/0001-mediatek-quiesce-workers-before-cleanup.patch'
      - '.github/workflows/rfc-mediatek-patch.yml'
  pull_request:
    paths:
      - 'patches/rfc/0001-mediatek-quiesce-workers-before-cleanup.patch'
      - '.github/workflows/rfc-mediatek-patch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned upstream Linux v6.18 source file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream/drivers/net/ethernet/mediatek
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/torvalds/linux/v6.18/drivers/net/ethernet/mediatek/mtk_eth_soc.c \
            -o upstream/drivers/net/ethernet/mediatek/mtk_eth_soc.c
          test "$(git hash-object upstream/drivers/net/ethernet/mediatek/mtk_eth_soc.c)" = e68997a29191b2a8ce0868873dcfe95c79e10e56
      - name: Check and apply RFC to real upstream source
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          git apply --check ../patches/rfc/0001-mediatek-quiesce-workers-before-cleanup.patch
          git apply ../patches/rfc/0001-mediatek-quiesce-workers-before-cleanup.patch
          python3 - <<'PY'
          from pathlib import Path
          s = Path("drivers/net/ethernet/mediatek/mtk_eth_soc.c").read_text()
          fn = s.split("static int mtk_cleanup(struct mtk_eth *eth)", 1)[1].split("static int mtk_get_link_ksettings", 1)[0]
          assert fn.count("cancel_work_sync(&eth->pending_work)") == 1
          assert fn.count("cancel_delayed_work_sync(&eth->reset.monitor_work)") == 1
          assert fn.index("cancel_work_sync") < fn.index("mtk_free_dev")
          print("RFC APPLY AND ORDER CHECK PASS; kernel compilation not performed")
          PY
