name: p26 unsigned packer unit tests

on:
  push:
    branches:
      - work/p26-rootfs-unsigned-packer-20261104
    paths:
      - 'tools/build/pack_p26_rootfs.py'
      - 'tests/test_pack_p26_rootfs.py'
      - 'tests/test_verify_p26_independent.py'
      - 'tools/build/verify_p26_independent.py'
      - '.github/workflows/p26-packer-tests.yml'
  pull_request:
    paths:
      - 'tools/build/pack_p26_rootfs.py'
      - 'tests/test_pack_p26_rootfs.py'
      - 'tests/test_verify_p26_independent.py'
      - 'tools/build/verify_p26_independent.py'
      - '.github/workflows/p26-packer-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Compile Python modules
        run: python3 -m py_compile tools/build/pack_p26_rootfs.py tests/test_pack_p26_rootfs.py tools/build/verify_p26_independent.py tests/test_verify_p26_independent.py
      - name: Run p26 packer unit tests
        run: python3 -m unittest discover -s tests -p test_pack_p26_rootfs.py -v
      - name: Run independent verifier regression tests
        run: python3 -m unittest discover -s tests -p test_verify_p26_independent.py -v
      - name: Obtain SquashFS tools without elevated privileges
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d)"
          cd "$tool_dir"
          apt-get download squashfs-tools
          dpkg-deb -x squashfs-tools_*.deb "$tool_dir/unpacked"
          test -x "$tool_dir/unpacked/usr/bin/unsquashfs"
          test -x "$tool_dir/unpacked/usr/bin/mksquashfs"
          echo "$tool_dir/unpacked/usr/bin" >> "$GITHUB_PATH"
      - name: Pack and independently extract synthetic unsigned p26
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import tempfile
          import subprocess
          import hashlib

          with tempfile.TemporaryDirectory() as tmp:
              base = Path(tmp)
              root = base / "stage"
              root.mkdir()
              for name in ("bin/busybox", "sbin/procd", "sbin/ubusd",
                           "sbin/netifd", "sbin/uci", "usr/sbin/dropbear"):
                  p = root / name
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_bytes(b"synthetic test only\\n")
              shadow = root / "etc/shadow"
              shadow.parent.mkdir(parents=True, exist_ok=True)
              shadow.write_text("root:!:0:0:99999:7:::\\n")
              receipt = base / "source.json"
              receipt.write_text(json.dumps({
                  "openwrt_commit": "5799d2da76998be50432b0a3325b42713b4b619b",
                  "source_built": True, "package_install": True,
                  "packages": ["base-files", "busybox", "procd", "ubus",
                               "uci", "netifd", "dropbear"], "feeds": {}
              }))
              # Synthetic receipt is test input only, never source-build evidence.
              private = base / "private"
              private.mkdir(mode=0o700)
              os.chmod(private, 0o700)
              out = private / "packed"
              subprocess.run(["python3", "tools/build/pack_p26_rootfs.py",
                              "--rootfs", str(root), "--source-receipt",
                              str(receipt), "--output", str(out)], check=True)
              image = out / "rootfs_a.p26"
              raw = out / "rootfs.squashfs"
              metadata = json.loads((out / "p26-receipt.json").read_text())
              assert image.stat().st_size == 134217728
              assert hashlib.sha256(image.read_bytes()).hexdigest() == metadata["p26_sha256"]
              with image.open("rb") as stream:
                  stream.seek(raw.stat().st_size)
                  while block := stream.read(1048576):
                      assert not any(block), "nonzero padding"
              extracted = base / "extracted"
              subprocess.run(["unsquashfs", "-no-progress", "-d",
                              str(extracted), str(raw)], check=True)
              for p in root.rglob("*"):
                  rel = p.relative_to(root)
                  q = extracted / rel
                  assert q.exists(), f"missing: {rel}"
                  if p.is_file():
                      assert p.read_bytes() == q.read_bytes(), f"mismatch: {rel}"
              subprocess.run(["python3", "tools/build/verify_p26_independent.py",
                              "--rootfs", str(root), "--p26", str(image),
                              "--squashfs", str(raw)], check=True)
              print("SYNTHETIC_P26_PACK_INDEPENDENT_READBACK_PASS (NOT real OpenWrt build)")
          PY
