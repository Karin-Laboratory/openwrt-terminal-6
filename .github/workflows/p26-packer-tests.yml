name: p26 unsigned packer unit tests

on:
  push:
    branches:
      - work/p26-rootfs-unsigned-packer-20261104
    paths:
      - 'tools/build/pack_p26_rootfs.py'
      - 'tests/test_pack_p26_rootfs.py'
      - '.github/workflows/p26-packer-tests.yml'
  pull_request:
    paths:
      - 'tools/build/pack_p26_rootfs.py'
      - 'tests/test_pack_p26_rootfs.py'
      - '.github/workflows/p26-packer-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python modules
        run: python3 -m py_compile tools/build/pack_p26_rootfs.py tests/test_pack_p26_rootfs.py
      - name: Run p26 packer unit tests
        run: python3 -m unittest discover -s tests -p test_pack_p26_rootfs.py -v
