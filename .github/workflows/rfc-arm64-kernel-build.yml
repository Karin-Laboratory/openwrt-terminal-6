name: RFC full upstream ARM64 kernel build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rfc-arm64-kernel-build.yml'
      - 'patches/rfc/0001-mediatek-quiesce-workers-before-cleanup.patch'
      - 'patches/rfc/0002-mediatek-serialize-reset-requeue.patch'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install cross-compiler and kernel dependencies
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            case "$file" in
              *.list) sudo sed -i '/packages\.microsoft\.com/d' "$file" ;;
              *.sources) sudo mv "$file" "$file.disabled" ;;
            esac
          done < <(sudo grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d --include='*.list' --include='*.sources' || true)
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            make bc bison flex libssl-dev libelf-dev
      - name: Fetch pinned Linux and apply both public RFCs
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v6.18 --single-branch https://github.com/torvalds/linux.git linux
          cd linux
          test "$(git hash-object drivers/net/ethernet/mediatek/mtk_eth_soc.c)" = e68997a29191b2a8ce0868873dcfe95c79e10e56
          test "$(git hash-object drivers/net/ethernet/mediatek/mtk_eth_soc.h)" = 0168e2fbc6197a6aa9fe159767166e86915accbc
          git apply --check ../patches/rfc/0001-mediatek-quiesce-workers-before-cleanup.patch
          git apply ../patches/rfc/0001-mediatek-quiesce-workers-before-cleanup.patch
          git apply --check ../patches/rfc/0002-mediatek-serialize-reset-requeue.patch
          git apply ../patches/rfc/0002-mediatek-serialize-reset-requeue.patch
          git diff --check
      - name: Compile entire upstream ARM64 Image with built-in MediaTek Ethernet
        shell: bash
        run: |
          set -euo pipefail
          cd linux
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          scripts/config --enable CONFIG_COMPILE_TEST \
            --enable CONFIG_NET_VENDOR_MEDIATEK \
            --enable CONFIG_PHYLINK \
            --enable CONFIG_NET_DSA \
            --disable CONFIG_MODULES \
            --enable CONFIG_NET_MEDIATEK_SOC
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          grep -E '^(CONFIG_NET_MEDIATEK_SOC|CONFIG_COMPILE_TEST|CONFIG_PHYLINK)=' .config
          grep -Eq '^CONFIG_NET_MEDIATEK_SOC=y$' .config || {
            echo 'ERROR: MediaTek Ethernet was not configured as built-in' >&2
            exit 1
          }
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2 Image
          test -s arch/arm64/boot/Image
          test -s vmlinux
          test -s drivers/net/ethernet/mediatek/mtk_eth_soc.o
          aarch64-linux-gnu-nm vmlinux | grep -E ' [tT] mtk_probe([.]|$)' || {
            echo 'ERROR: MediaTek probe not linked into vmlinux' >&2
            exit 1
          }
          sha256sum arch/arm64/boot/Image | tee /tmp/image.sha256
          {
            echo '### ARM64 upstream kernel build with RFC1 and RFC2'
            echo 'MediaTek Ethernet built into vmlinux; this is NOT SBAT6D firmware.'
            echo "Image SHA-256: $(cut -d' ' -f1 /tmp/image.sha256)"
            echo "Config: $(grep '^CONFIG_NET_MEDIATEK_SOC=' .config)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Explicit scope
        if: always()
        run: |
          echo 'No board DTS, rootfs, OEM signing, installable boot image or device write.' >> "$GITHUB_STEP_SUMMARY"
