name: MT6990 PHY compile probe (public)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mt6990-phy-compile-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phy-object:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Install ARM64 build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git make gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev python3
      - name: Fetch exact publicly available donor
        run: |
          set -euo pipefail
          git init donor
          git -C donor remote add origin https://github.com/13179415360/openwrt-mt6990-lg6851f.git
          git -C donor fetch --depth 1 origin a40df9a5afb46716dea799acea69f17480df4d82
          git -C donor checkout --detach FETCH_HEAD
          test "$(git -C donor rev-parse HEAD)" = a40df9a5afb46716dea799acea69f17480df4d82
          test "$(git -C donor rev-parse HEAD:target/linux/mediatek/files-6.18/drivers/phy/mediatek/phy-mtk-mt6990-sgmii.c)" = 598f9c8d0a905bf6e293157d2fd475fef54bfacd
      - name: Retrieve unmodified upstream Linux 6.18.44
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v6.18.44 https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git kernel
          test "$(make -s -C kernel kernelversion)" = 6.18.44
      - name: Compile donor analog PHY against vanilla kernel
        run: |
          set -euo pipefail
          cp donor/target/linux/mediatek/files-6.18/drivers/phy/mediatek/phy-mtk-mt6990-sgmii.c kernel/drivers/phy/mediatek/
          make -C kernel ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          make -C kernel ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2 prepare
          make -C kernel ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2 drivers/phy/mediatek/phy-mtk-mt6990-sgmii.o
          object=kernel/drivers/phy/mediatek/phy-mtk-mt6990-sgmii.o
          test -s "$object"
          aarch64-linux-gnu-readelf -h "$object" | tee phy-object-elf-header.txt
          aarch64-linux-gnu-readelf -h "$object" | grep -Eq 'Machine:[[:space:]]+AArch64'
          sha256sum "$object" | tee phy-object-sha256.txt
          {
            echo '### Compiler output'
            echo 'Validated ELF machine: AArch64'
            echo 'Object SHA-256:'
            cat phy-object-sha256.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record probe limitation
        if: always()
        run: |
          {
            echo '## MT6990 source-only compile probe'
            echo 'Donor: 13179415360/openwrt-mt6990-lg6851f @ a40df9a5afb46716dea799acea69f17480df4d82'
            echo 'Kernel: upstream v6.18.44, ARM64 cross compilation'
            echo 'Scope: donor PHY object only, **not** SBA6D private PHY adaptation or PCS patches'
            echo 'No secrets, SDK binaries, signing, image assembly, device access or flashing.'
          } >> "$GITHUB_STEP_SUMMARY"
