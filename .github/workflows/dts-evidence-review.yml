name: SBAT6D DTS evidence review

on:
  push:
    branches:
      - research/sbat6d-dts-evidence
      - integration/openwrt-source-gate
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python source syntax
        run: |
          python3 -m compileall -q tools tests
      - name: Run all public unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Audit DTS evidence without claiming hardware readiness
        shell: bash
        run: |
          if test -f board/sbat6d-dts-evidence.json; then
            python3 tools/check_sbat6d_dts_evidence.py board/sbat6d-dts-evidence.json
            python3 tools/report_sbat6d_dts_evidence.py board/sbat6d-dts-evidence.json --output /tmp/sbat6d-dts-checklist.md
            cat /tmp/sbat6d-dts-checklist.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check OpenWrt kernel compatibility gate fails closed
        shell: bash
        run: |
          if test -f tools/check_openwrt_rfc_compat.py; then
            python3 tools/check_openwrt_rfc_compat.py .
            if python3 tools/check_openwrt_rfc_compat.py . --require-exact; then
              echo 'ERROR: unexpected kernel source match' >&2
              exit 1
            fi
          fi
      - name: Validate standalone DTS syntax fixture
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y device-tree-compiler
          printf '/dts-v1/;\n/ { compatible = "test,syntax-only"; };\n' > /tmp/dts-syntax-fixture.dts
          python3 tools/validate_candidate_dts.py /tmp/dts-syntax-fixture.dts --require-pass
      - name: Scope
        if: always()
        run: echo 'Source validation only; not a board DTS, firmware build or flashing test' >> "$GITHUB_STEP_SUMMARY"
