name: Trusted self-hosted ARM64 source build
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trusted-selfhost-build.yml'
      - 'patches/**'
      - 'scripts/**'
      - 'tools/**'
      - 'tests/**'
      - 'examples/**'
      - 'config/source-catalog.json'

permissions:
  contents: read

jobs:
  arm64-source:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Karin-Laboratory/openwrt-terminal-6' }}
    runs-on: [self-hosted, linux, x64, sbat6-recovery]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout trusted main source without persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fail-closed trusted runner preflight
        run: |
          set -euo pipefail
          umask 077
          test "${GITHUB_EVENT_NAME}" = push
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_REPOSITORY}" = Karin-Laboratory/openwrt-terminal-6
          test "$(id -u)" -ne 0
          for command in git python3 make cc curl aarch64-linux-gnu-gcc; do
            command -v "$command" >/dev/null || { echo "Missing preinstalled compiler/tool: $command"; exit 2; }
          done
          echo 'Trusted main and preinstalled non-root toolchain preflight: PASS'
      - name: Run host-only regressions and new-history safety gates
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m unittest discover -s tools/modem -p 'test_*.py' -v
          make -C examples/fe-recovery test
          python3 tools/build/verify_source_catalog.py
          python3 tools/security/check_workflows.py
          python3 tools/security/check_publication.py --history
          make -C examples/fe-recovery clean
      - name: Isolated Linux 6.18 ARM64 MediaTek baseline and RFC object builds
        run: |
          set -euo pipefail
          umask 077
          temporary="$(mktemp -d "${RUNNER_TEMP:-/tmp}/sbat6-src.XXXXXXXX")"
          trap 'rm -rf -- "$temporary"' EXIT
          git clone --quiet --depth 1 --branch v6.18 --single-branch https://github.com/torvalds/linux.git "$temporary/linux"
          cd "$temporary/linux"
          test "$(git rev-parse HEAD)" = 7d0a66e4bb9081d75c82ec4957c50034cb0ea449
          test "$(git hash-object drivers/net/ethernet/mediatek/mtk_eth_soc.c)" = e68997a29191b2a8ce0868873dcfe95c79e10e56
          test "$(git hash-object drivers/net/ethernet/mediatek/mtk_eth_soc.h)" = 0168e2fbc6197a6aa9fe159767166e86915accbc
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          scripts/config --enable CONFIG_COMPILE_TEST --enable CONFIG_NET_VENDOR_MEDIATEK --enable CONFIG_NET_MEDIATEK_SOC --enable CONFIG_NET_DSA
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          grep -Eq '^CONFIG_NET_MEDIATEK_SOC=(y|m)$' .config
          object=drivers/net/ethernet/mediatek/mtk_eth_soc.o
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2 "$object"
          baseline="$(sha256sum "$object" | cut -d' ' -f1)"
          rm -f -- "$object"
          git apply --check "$GITHUB_WORKSPACE/patches/rfc/0001-mediatek-quiesce-workers-before-cleanup.patch"
          git apply "$GITHUB_WORKSPACE/patches/rfc/0001-mediatek-quiesce-workers-before-cleanup.patch"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2 "$object"
          rfc1="$(sha256sum "$object" | cut -d' ' -f1)"
          rm -f -- "$object"
          git apply --check "$GITHUB_WORKSPACE/patches/rfc/0002-mediatek-serialize-reset-requeue.patch"
          git apply "$GITHUB_WORKSPACE/patches/rfc/0002-mediatek-serialize-reset-requeue.patch"
          python3 "$GITHUB_WORKSPACE/tools/check_mediatek_rfc_series.py" --source .
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2 "$object"
          rfc12="$(sha256sum "$object" | cut -d' ' -f1)"
          git diff --check
          {
            echo '### Verified source-only ARM64 builds'
            echo 'Linux v6.18 pinned commit: 7d0a66e4bb9081d75c82ec4957c50034cb0ea449'
            echo "Baseline Ethernet object SHA-256: $baseline"
            echo "RFC 0001 Ethernet object SHA-256: $rfc1"
            echo "RFC 0001+0002 Ethernet object SHA-256: $rfc12"
            echo 'No installable firmware, device change, signing operation or proprietary input'
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'ARM64_BASELINE_RFC1_RFC12_OBJECT_BUILD_PASS'
