name: RFC MediaTek kernel object compile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rfc-mediatek-object-compile.yml'
      - 'patches/rfc/0001-mediatek-quiesce-workers-before-cleanup.patch'
      - 'patches/rfc/0002-mediatek-serialize-reset-requeue.patch'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  object-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install ARM64 compiler and build dependencies
        run: |
          # The hosted runner can include a Microsoft APT source that returns 403.
          # Disable only that third-party source, leaving Ubuntu mirrors enabled.
          while IFS= read -r file; do
            case "$file" in
              *.list)
                sudo sed -i '/packages\\.microsoft\\.com/d' "$file"
                ;;
              *.sources)
                sudo mv "$file" "$file.disabled"
                ;;
            esac
          done < <(sudo grep -rl 'packages.microsoft.com' /etc/apt/sources.list.d --include='*.list' --include='*.sources' || true)
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            make bc bison flex libssl-dev libelf-dev
      - name: Fetch pinned upstream Linux v6.18
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v6.18 --single-branch \
            https://github.com/torvalds/linux.git linux
          cd linux
          test "$(git hash-object drivers/net/ethernet/mediatek/mtk_eth_soc.c)" = \
            e68997a29191b2a8ce0868873dcfe95c79e10e56
          test "$(git hash-object drivers/net/ethernet/mediatek/mtk_eth_soc.h)" = \
            0168e2fbc6197a6aa9fe159767166e86915accbc
      - name: Build baseline and patched objects
        shell: bash
        run: |
          set -euo pipefail
          cd linux
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          scripts/config --enable CONFIG_COMPILE_TEST \
            --enable CONFIG_NET_VENDOR_MEDIATEK \
            --enable CONFIG_NET_MEDIATEK_SOC \
            --enable CONFIG_NET_DSA
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          grep -E '^CONFIG_(COMPILE_TEST|NET_VENDOR_MEDIATEK|NET_MEDIATEK_SOC)=' .config
          grep -Eq '^CONFIG_NET_MEDIATEK_SOC=(y|m)$' .config || {
            echo 'ERROR: MediaTek Ethernet is disabled' >&2
            exit 1
          }
          object=drivers/net/ethernet/mediatek/mtk_eth_soc.o
          echo 'Compiling unchanged upstream object'
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2 \
            "$object"
          sha256sum "$object" | tee /tmp/mtk-baseline.sha256
          rm "$object"
          git apply --check ../patches/rfc/0001-mediatek-quiesce-workers-before-cleanup.patch
          git apply ../patches/rfc/0001-mediatek-quiesce-workers-before-cleanup.patch
          echo 'Compiling RFC 0001 object'
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2 \
            "$object"
          sha256sum "$object" | tee /tmp/mtk-rfc1.sha256
          rm "$object"
          git apply --check ../patches/rfc/0002-mediatek-serialize-reset-requeue.patch
          git apply ../patches/rfc/0002-mediatek-serialize-reset-requeue.patch
          python3 ../tools/check_mediatek_rfc_series.py --source .
          echo 'Compiling RFC 0001 + RFC 0002 object'
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2 "$object"
          sha256sum "$object" | tee /tmp/mtk-rfc12.sha256
          echo "### MediaTek RFC ARM64 compile evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "Upstream: torvalds/linux v6.18" >> "$GITHUB_STEP_SUMMARY"
          echo "Upstream source blob: e68997a29191b2a8ce0868873dcfe95c79e10e56" >> "$GITHUB_STEP_SUMMARY"
          echo "Config: $(grep '^CONFIG_NET_MEDIATEK_SOC=' .config)" >> "$GITHUB_STEP_SUMMARY"
          echo "Baseline object SHA-256: $(cut -d' ' -f1 /tmp/mtk-baseline.sha256)" >> "$GITHUB_STEP_SUMMARY"
          echo "RFC 0001 object SHA-256: $(cut -d' ' -f1 /tmp/mtk-rfc1.sha256)" >> "$GITHUB_STEP_SUMMARY"
          echo "RFC 0001 + RFC 0002 object SHA-256: $(cut -d' ' -f1 /tmp/mtk-rfc12.sha256)" >> "$GITHUB_STEP_SUMMARY"
          git diff --check
          echo 'BASELINE_RFC1_RFC12_OBJECT_BUILD_PASS'
      - name: Explain scope
        if: always()
        run: |
          echo 'Compilation-only RFC check; no image or firmware is built or flashed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Success does not prove lifecycle safety or runtime correctness.' >> "$GITHUB_STEP_SUMMARY"
