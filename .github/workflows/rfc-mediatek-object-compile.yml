name: RFC MediaTek kernel object compile (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  object-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install ARM64 compiler and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            make bc bison flex libssl-dev libelf-dev
      - name: Fetch pinned Linux source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v6.18 --single-branch \
            https://github.com/torvalds/linux.git linux
          cd linux
          test "$(git hash-object drivers/net/ethernet/mediatek/mtk_eth_soc.c)" = \
            e68997a29191b2a8ce0868873dcfe95c79e10e56
      - name: Configure, compile baseline, then compile patched object
        shell: bash
        run: |
          set -euo pipefail
          cd linux
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          scripts/config --enable CONFIG_COMPILE_TEST \
            --enable CONFIG_NET_VENDOR_MEDIATEK \
            --enable CONFIG_NET_MEDIATEK_SOC --enable CONFIG_PHYLINK \
            --enable CONFIG_NET_DSA
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          grep -E '^(CONFIG_COMPILE_TEST|CONFIG_NET_VENDOR_MEDIATEK|CONFIG_NET_MEDIATEK_SOC)=' .config
          if ! grep -Eq '^CONFIG_NET_MEDIATEK_SOC=(y|m)
            exit 1
          fi
          echo 'Compiling unmodified upstream object'
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2 \
            drivers/net/ethernet/mediatek/mtk_eth_soc.o
          sha256sum drivers/net/ethernet/mediatek/mtk_eth_soc.o | tee /tmp/mediatek-baseline.sha256
          rm drivers/net/ethernet/mediatek/mtk_eth_soc.o
          git apply --check ../patches/rfc/0001-mediatek-quiesce-workers-before-cleanup.patch
          git apply ../patches/rfc/0001-mediatek-quiesce-workers-before-cleanup.patch
          echo 'Compiling RFC-patched object using the same configuration'
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2 \
            drivers/net/ethernet/mediatek/mtk_eth_soc.o
          sha256sum drivers/net/ethernet/mediatek/mtk_eth_soc.o | tee /tmp/mediatek-rfc.sha256
          test "$(cut -d' ' -f1 /tmp/mediatek-baseline.sha256)" != "$(cut -d' ' -f1 /tmp/mediatek-rfc.sha256)"
          git diff --check
          echo CONTROL_AND_PATCHED_OBJECT_COMPILE_PASS
      - name: Explain scope
        if: always()
        run: |
          echo 'This is a compile-only RFC investigation.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No kernel image, rootfs, signed firmware, device write, or runtime test.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Passing does not establish safe FE recovery or driver removal.' >> "$GITHUB_STEP_SUMMARY"
 .config; then
            echo 'ERROR: NET_MEDIATEK_SOC is neither built-in nor module; inspect Kconfig dependencies' >&2
            exit 1
          fi
          echo 'Compiling unmodified upstream object'
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2 \
            drivers/net/ethernet/mediatek/mtk_eth_soc.o
          sha256sum drivers/net/ethernet/mediatek/mtk_eth_soc.o | tee /tmp/mediatek-baseline.sha256
          rm drivers/net/ethernet/mediatek/mtk_eth_soc.o
          git apply --check ../patches/rfc/0001-mediatek-quiesce-workers-before-cleanup.patch
          git apply ../patches/rfc/0001-mediatek-quiesce-workers-before-cleanup.patch
          echo 'Compiling RFC-patched object using the same configuration'
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j2 \
            drivers/net/ethernet/mediatek/mtk_eth_soc.o
          sha256sum drivers/net/ethernet/mediatek/mtk_eth_soc.o | tee /tmp/mediatek-rfc.sha256
          test "$(cut -d' ' -f1 /tmp/mediatek-baseline.sha256)" != "$(cut -d' ' -f1 /tmp/mediatek-rfc.sha256)"
          git diff --check
          echo CONTROL_AND_PATCHED_OBJECT_COMPILE_PASS
      - name: Explain scope
        if: always()
        run: |
          echo 'This is a compile-only RFC investigation.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No kernel image, rootfs, signed firmware, device write, or runtime test.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Passing does not establish safe FE recovery or driver removal.' >> "$GITHUB_STEP_SUMMARY"
