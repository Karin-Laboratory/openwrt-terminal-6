name: First-time onboarding docs QA
on:
  pull_request:
    paths:
      - 'README.md'
      - 'agent-entry.json'
      - 'docs/TERMINAL6-FW-COMPATIBILITY.json'
      - 'docs/AB-FALLBACK-RESEARCH.md'
      - 'tools/qa/p43_unsplit_offline.py'
      - 'tools/air6-rescue-qemu-v0.3/n-unit-split-qemu.sh'
      - 'config/source-catalog.json'
      - 'AGENT-START.ja.md'
      - 'docs/AGENT-ENTRY-OFFLINE-AUDIT-20261113.ja.md'
      - 'START-HERE.ja.md'
      - 'docs/TERMINAL6-PREPARATION-AGENT-WORKFLOW.json'
      - 'docs/RELEASE-GATES.md'
      - 'tools/qa/test_onboarding_contract.py'
      - '.github/workflows/onboarding-docs-qa.yml'
  workflow_dispatch:
jobs:
  consistency:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate agent-neutral onboarding contract
        run: python3 tools/qa/test_onboarding_contract.py
