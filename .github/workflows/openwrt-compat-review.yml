name: OpenWrt source compatibility review

on:
  push:
    branches:
      - research/sbat6d-dts-evidence
      - integration/openwrt-source-gate
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python source syntax
        run: |
          python3 -m compileall -q tools tests
      - name: Run all public unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Audit DTS evidence without claiming hardware readiness
        shell: bash
        run: |
          if test -f board/sbat6d-dts-evidence.json; then
            python3 tools/check_sbat6d_dts_evidence.py board/sbat6d-dts-evidence.json
          fi
      - name: Check OpenWrt kernel compatibility gate fails closed
        shell: bash
        run: |
          if test -f tools/check_openwrt_rfc_compat.py; then
            python3 tools/check_openwrt_rfc_compat.py .
            if python3 tools/check_openwrt_rfc_compat.py . --require-exact; then
              echo 'ERROR: unexpected kernel source match' >&2
              exit 1
            fi
          fi
      - name: Positive compatibility gate on pinned upstream blobs
        shell: bash
        run: |
          if test -f tools/check_openwrt_rfc_compat.py; then
            set -euo pipefail
            mkdir -p pinned/drivers/net/ethernet/mediatek
            curl -fLsS --retry 3 https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/plain/drivers/net/ethernet/mediatek/mtk_eth_soc.c?h=v6.18 -o pinned/drivers/net/ethernet/mediatek/mtk_eth_soc.c
            curl -fLsS --retry 3 https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/plain/drivers/net/ethernet/mediatek/mtk_eth_soc.h?h=v6.18 -o pinned/drivers/net/ethernet/mediatek/mtk_eth_soc.h
            python3 tools/check_openwrt_rfc_compat.py pinned --require-exact
            git -C pinned init -q
            git -C pinned add drivers/net/ethernet/mediatek/mtk_eth_soc.c drivers/net/ethernet/mediatek/mtk_eth_soc.h
            git -C pinned -c user.name='RFC review' -c user.email='noreply@example.invalid' commit -qm 'Pinned source blobs'
            bash integration/preflight-openwrt-rfc.sh pinned
            bash scripts/apply-public-rfc-series.sh --apply pinned
            python3 tools/check_mediatek_rfc_series.py --source pinned
            git -C pinned diff --check
            test -n "$(git -C pinned diff -- drivers/net/ethernet/mediatek/mtk_eth_soc.c)"
            test -n "$(git -C pinned diff -- drivers/net/ethernet/mediatek/mtk_eth_soc.h)"
          fi
      - name: Scope
        if: always()
        run: echo 'Source validation only; not a board DTS, firmware build or flashing test' >> "$GITHUB_STEP_SUMMARY"
