name: Source-only tests and publication preflight
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tests:
    name: Safe host tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate offline Stage 10 regression
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate synthetic modem lifecycle
        run: python3 -m unittest discover -s tools/modem -p 'test_*.py' -v
      - name: Validate independent FE recovery model
        run: make -C examples/fe-recovery test
      - name: Verify both Ethernet RFC patches against pinned Linux v6.18 source
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/linux/drivers/net/ethernet/mediatek"
          git -C "$tmp/linux" init -q
          for file in mtk_eth_soc.c mtk_eth_soc.h; do
            curl --fail --silent --show-error --location --retry 3 --max-time 45 \
              "https://raw.githubusercontent.com/torvalds/linux/v6.18/drivers/net/ethernet/mediatek/$file" \
              --output "$tmp/linux/drivers/net/ethernet/mediatek/$file"
          done
          bash scripts/apply-public-rfc-series.sh "$tmp/linux"
      - name: Compile disabled SGMII overlay with pinned Linux host dtc
        run: bash scripts/verify-disabled-sgmii-dtc.sh
      - name: Compile independent Air6 board DTS with pinned SoC source (no firmware)
        run: bash scripts/verify-air6-board-dtc.sh
      - name: Reject unpinned or untrusted OpenWrt feeds
        run: python3 tools/build/verify_feeds_lock.py config/feeds.lock
      - name: Verify pinned source-only build contract
        run: python3 tools/build/verify_source_catalog.py
      - name: Verify public CI trust policy
        run: python3 tools/security/check_workflows.py
      - name: Scan new repository reachable history
        run: python3 tools/security/check_publication.py --history
      - name: Publication is still gated
        run: |
          echo "Source checks do not scan GitHub issue/PR text, Actions logs, prior archives, third-party rights or firmware safety."
          echo "A successful run is NOT authorization to publish firmware."
