name: Source-only tests and publication preflight
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tests:
    name: Safe host tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate offline Stage 10 regression
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate synthetic modem lifecycle
        run: python3 -m unittest discover -s tools/modem -p 'test_*.py' -v
      - name: Validate independent FE recovery model with and without NDEBUG
        run: |
          make -C examples/fe-recovery clean test
          make -C examples/fe-recovery clean test CFLAGS="-O2 -g -Wall -Wextra -Werror -std=c11 -DNDEBUG"
          make -C examples/fe-recovery clean
      - name: Verify both Ethernet RFC patches against pinned Linux v6.18 source
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/linux/drivers/net/ethernet/mediatek"
          git -C "$tmp/linux" init -q
          for file in mtk_eth_soc.c mtk_eth_soc.h; do
            destination="$tmp/linux/drivers/net/ethernet/mediatek/$file"
            if ! curl --fail --silent --show-error --location --retry 2 --max-time 45 \
                "https://raw.githubusercontent.com/torvalds/linux/v6.18/drivers/net/ethernet/mediatek/$file" \
                --output "$destination"; then
              # GitHub Contents API fallback when raw CDN returns HTTP 429.
              # The existing RFC preflight still checks exact v6.18 Git blob SHAs.
              curl --fail --silent --show-error --retry 2 --max-time 45 \
                -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/repos/torvalds/linux/contents/drivers/net/ethernet/mediatek/$file?ref=v6.18" \
                --output "$tmp/github-content.json"
              python3 - "$tmp/github-content.json" "$destination" <<'PY'
          import base64, json, pathlib, sys
          record = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if record.get("encoding") != "base64" or record.get("type") != "file":
              raise SystemExit("Unexpected GitHub Contents API shape")
          pathlib.Path(sys.argv[2]).write_bytes(base64.b64decode(record["content"], validate=False))
          PY
            fi
          done
          git -C "$tmp/linux" add drivers/net/ethernet/mediatek/mtk_eth_soc.c drivers/net/ethernet/mediatek/mtk_eth_soc.h
          git -C "$tmp/linux" -c user.name="Source-only CI" -c user.email="source-only@example.invalid" commit -qm "Record pinned v6.18 inputs for clean-worktree preflight"
          bash scripts/apply-public-rfc-series.sh "$tmp/linux"
      - name: Compile disabled SGMII overlay with pinned Linux host dtc
        run: bash scripts/verify-disabled-sgmii-dtc.sh
      - name: Reject unreviewed Air6 peripheral enablement
        run: python3 tools/board/check_air6_scope.py
      - name: Compile independent Air6 board DTS with pinned SoC source (no firmware)
        run: bash scripts/verify-air6-board-dtc.sh
      - name: Reject unpinned or untrusted OpenWrt feeds
        run: python3 tools/build/verify_feeds_lock.py config/feeds.lock
      - name: Validate pinned noninstallable Air6 userland selection
        run: python3 tools/build/check_air6_userspace_source.py
      - name: Verify pinned source-only build contract
        run: python3 tools/build/verify_source_catalog.py
      - name: Verify public CI trust policy
        run: python3 tools/security/check_workflows.py
      - name: Scan new repository reachable history
        run: python3 tools/security/check_publication.py --history
      - name: Publication is still gated
        run: |
          echo "Source checks do not scan GitHub issue/PR text, Actions logs, prior archives, third-party rights or firmware safety."
          echo "A successful run is NOT authorization to publish firmware."

  arm64-initramfs:
    name: Build unsigned ARM64 diagnostic initramfs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build ephemeral native AArch64 PID1 initramfs (not firmware)
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          python3 scripts/build-minimal-arm64-initramfs.py "$tmp/staging"
          test -s "$tmp/staging/initramfs.cpio.gz"
          test -s "$tmp/staging/manifest.json"


  arm64-busybox-native:
    name: Compile static AArch64 BusyBox and package noninstallable rootfs stage
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build ephemeral static ARM64 BusyBox and rootfs-stage archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(id -u)" -ne 0
          bash scripts/build-arm64-busybox-smoke.sh native-static-stage
          echo 'SBAT6_STATIC_BUSYBOX_HOSTED_BUILD_PASS (glibc-static stage, not OpenWrt/musl/firmware)'

  arm64-musl-native:
    name: Build pinned musl libc and static ARM64 BusyBox stage (noninstallable)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile ephemeral musl 1.2.5 and native static BusyBox
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(id -u)" -ne 0
          bash scripts/build-arm64-musl-busybox-stage.sh
          echo 'LIMIT: native musl compiler is not an OpenWrt SDK; no installable rootfs or device test.'
