name: Unsigned p25 boot-v2 host regression
on:
  pull_request:
    paths:
      - 'tools/boot/pack_p25_unsigned_v2.py'
      - 'tools/boot/verify_p25_independent.py'
      - 'tests/test_pack_p25_unsigned_v2.py'
      - '.github/workflows/p25-boot-v2-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run synthetic unsigned p25 layout tests without artifacts
        run: |
          python3 -m py_compile tools/boot/pack_p25_unsigned_v2.py tools/boot/verify_p25_independent.py tests/test_pack_p25_unsigned_v2.py
          python3 -m unittest discover -s tests -p test_pack_p25_unsigned_v2.py -v
