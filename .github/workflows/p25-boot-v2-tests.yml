name: Unsigned p25 boot-v2 host regression
on:
  pull_request:
    paths:
      - 'tools/boot/pack_p25_unsigned_v2.py'
      - 'tools/boot/verify_p25_independent.py'
      - 'tools/boot/verify_bound_p26.sh'
      - 'tools/boot/air6_first_stage.sh'
      - 'tools/build/build_air6_first_stage.py'
      - 'tests/test_build_air6_first_stage.py'
      - 'tests/test_air6_first_stage_contract.py'
      - 'tests/test_verify_bound_p26.py'
      - 'tests/test_pack_p25_unsigned_v2.py'
      - 'tools/boot/audit_p25_reference_v2.py'
      - 'tests/test_audit_p25_reference_v2.py'
      - 'tools/boot/verify_kernel_initramfs.py'
      - 'tools/build/verify_unsigned_pair.py'
      - 'tests/test_verify_kernel_initramfs.py'
      - 'tests/test_verify_unsigned_pair.py'
      - 'docs/P25-UNSIGNED-BOOT-V2-MANUFACTURE.md'
      - '.github/workflows/p25-boot-v2-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run synthetic unsigned p25 layout tests without artifacts
        run: |
          python3 -m py_compile tools/boot/pack_p25_unsigned_v2.py tools/boot/verify_p25_independent.py tests/test_pack_p25_unsigned_v2.py
          python3 -m unittest discover -s tests -p test_pack_p25_unsigned_v2.py -v
          python3 -m py_compile tools/boot/audit_p25_reference_v2.py tests/test_audit_p25_reference_v2.py
          python3 -m unittest discover -s tests -p test_audit_p25_reference_v2.py -v
          python3 -m py_compile tools/boot/verify_kernel_initramfs.py tools/build/verify_unsigned_pair.py
          python3 -m unittest discover -s tests -p test_verify_kernel_initramfs.py -v
          python3 -m unittest discover -s tests -p test_verify_unsigned_pair.py -v
          sh -n tools/boot/verify_bound_p26.sh
          python3 -m unittest discover -s tests -p test_verify_bound_p26.py -v
          sh -n tools/boot/air6_first_stage.sh
          python3 -m py_compile tools/build/build_air6_first_stage.py tests/test_build_air6_first_stage.py
          python3 -m unittest discover -s tests -p test_build_air6_first_stage.py -v
          python3 -m unittest discover -s tests -p test_air6_first_stage_contract.py -v
