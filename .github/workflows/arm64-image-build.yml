name: ARM64 Image with musl-static procd PID1 (unsigned research build)
on:
  pull_request:
    paths:
      - .github/workflows/arm64-image-build.yml
      - scripts/air6-diagnostic-init.c
      - scripts/build-minimal-arm64-initramfs.py
      - scripts/build-arm64-busybox-smoke.sh
      - scripts/build-arm64-musl-busybox-stage.sh
      - scripts/build-arm64-musl-libubox-core.sh
      - scripts/build-arm64-musl-netifd-linux-object.sh
      - scripts/package-arm64-busybox-initramfs.py
      - scripts/package-arm64-busybox-rootfs.py
      - scripts/package-arm64-procd-stage-initramfs.py
      - scripts/smoke-arm64-musl-ipc.py
      - scripts/smoke-arm64-procd-guest.sh
      - 'config/sbat6-stage/**'
      - board/mt6990-air-terminal-6.dts
      - board/mt6990-air-terminal-6-ethernet-test.dts
      - patches/mt6990/0002-air6-avoid-sgmii-top-cycle.patch
  push:
    branches: [main]
    paths:
      - .github/workflows/arm64-image-build.yml
      - scripts/air6-diagnostic-init.c
      - scripts/build-minimal-arm64-initramfs.py
      - scripts/build-arm64-busybox-smoke.sh
      - scripts/build-arm64-musl-busybox-stage.sh
      - scripts/build-arm64-musl-libubox-core.sh
      - scripts/build-arm64-musl-netifd-linux-object.sh
      - scripts/package-arm64-busybox-initramfs.py
      - scripts/package-arm64-busybox-rootfs.py
      - scripts/package-arm64-procd-stage-initramfs.py
      - scripts/smoke-arm64-musl-ipc.py
      - scripts/smoke-arm64-procd-guest.sh
      - 'config/sbat6-stage/**'
      - patches/mt6990/0002-air6-avoid-sgmii-top-cycle.patch
  workflow_dispatch:
permissions:
  contents: read
# Avoid wasting hosted ARM64 minutes on superseded PR revisions.
concurrency:
  group: arm64-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  arm64-image-with-initramfs:
    name: Build unsigned ARM64 Image with real musl procd PID1 stage
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile pinned Linux v6.18 Image with compiled AArch64 musl procd init stage
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          # Compile the real pinned OpenWrt procd init and service manager
          # alongside BusyBox, ubusd, ubus, UCI and netifd using one native musl ABI.
          # Convert their verified noninstallable rootfs stage into newc.
          # No device/login/network configuration, upload or release.
          mkdir -p "$tmp/ramfs"
          SBAT6_MUSL_SERVICES_ROOTFS_OUTPUT="$tmp/ramfs/services.tar.gz" \
          SBAT6_MUSL_SERVICES_MANIFEST_OUTPUT="$tmp/ramfs/services.json" \
          SBAT6_BUILD_ROOTFS_SERVICES=1 SBAT6_BUILD_NETIFD_LINUX_OBJECT=1 \
          SBAT6_BUILD_PROCD_SERVICE=1 \
          SBAT6_BUILD_PROCD_INIT=1 SBAT6_BUILD_UCI=1 SBAT6_BUILD_UBUSD=1 \
          SBAT6_BUILD_UBUS_CORE=1 SBAT6_BUILD_LIBUBOX_CORE=1 \
            bash scripts/build-arm64-musl-busybox-stage.sh
          python3 scripts/package-arm64-procd-stage-initramfs.py \
            "$tmp/ramfs/services.tar.gz" "$tmp/ramfs/services.json" \
            "$tmp/ramfs/initramfs.cpio.gz" "$tmp/ramfs/manifest.json"
          python3 - "$tmp/ramfs/manifest.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              manifest = json.load(stream)
          assert manifest["libc"] == "native-musl-static-1.2.5"
          assert manifest["scope"] == "NONINSTALLABLE_AIR6_PROCD_STAGE_EMBEDDED_INITRAMFS"
          assert manifest["rights_review"] == "pending"
          assert manifest["init"] == "symlink-to-real-upstream-procd-init-ELF"
          assert "sbin/netifd" in manifest["files_sha256"]
          for policy in ("etc/preinit", "etc/inittab", "etc/rc.d/S10netifd", "etc/config/network", "etc/passwd", "etc/group"):
              assert policy in manifest["files_sha256"]
          PY
          test -s "$tmp/ramfs/initramfs.cpio.gz"
          test -s "$tmp/ramfs/manifest.json"
          # Real, non-root ARM64 execution of the pinned static IPC binaries.
          # The only endpoint is a private AF_UNIX socket; UCI reads the
          # packaged loopback config. No procd, netifd or host networking.
          python3 "$GITHUB_WORKSPACE/scripts/smoke-arm64-musl-ipc.py" \
            "$tmp/ramfs/services.tar.gz" "$tmp/ramfs/services.json"
          # Official upstream GPL Linux, not the vendor MT6990 kernel or Air6 firmware.
          timeout 600s git -c protocol.version=2 clone --quiet --depth 1 \
            --filter=blob:none --single-branch --branch v6.18 \
            https://github.com/torvalds/linux.git "$tmp/linux"
          test "$(git -C "$tmp/linux" rev-parse HEAD)" = \
            7d0a66e4bb9081d75c82ec4957c50034cb0ea449
          cd "$tmp/linux"
          # Compile the exact public GPL-labelled MT6990 SGMII analog PHY
          # source, with the existing no-TOP-cycle delta, in the SAME
          # Linux v6.18 Kbuild tree as Image/PCS/DSA and the Air6 DTBs.
          # Transient build input only: rights review is pending, no binary
          # upload, distribution, signing, or hardware operation.
          phy_url=https://raw.githubusercontent.com/13179415360/openwrt-mt6990-lg6851f/a40df9a5afb46716dea799acea69f17480df4d82/target/linux/mediatek/files-6.18/drivers/phy/mediatek/phy-mtk-mt6990-sgmii.c
          curl --fail --silent --show-error --location --retry 3 --max-time 90 \
            "$phy_url" -o drivers/phy/mediatek/phy-mtk-mt6990-sgmii.c
          test "$(git hash-object drivers/phy/mediatek/phy-mtk-mt6990-sgmii.c)" = \
            598f9c8d0a905bf6e293157d2fd475fef54bfacd
          git apply --check "$GITHUB_WORKSPACE/patches/mt6990/0002-air6-avoid-sgmii-top-cycle.patch"
          git apply "$GITHUB_WORKSPACE/patches/mt6990/0002-air6-avoid-sgmii-top-cycle.patch"
          ! grep -q 'mt6990_sgmii_top_cycle' drivers/phy/mediatek/phy-mtk-mt6990-sgmii.c
          cat >> drivers/phy/mediatek/Kconfig <<'EOF'

          config PHY_MTK_MT6990_SGMII
            bool "MT6990 SGMII analog PHY (Air6 compile-only research)"
            depends on OF && ARCH_MEDIATEK && MFD_SYSCON
            select GENERIC_PHY
          EOF
          cat >> drivers/phy/mediatek/Makefile <<'EOF'
          obj-$(CONFIG_PHY_MTK_MT6990_SGMII) += phy-mtk-mt6990-sgmii.o
          EOF
          # MT6990 IFRAO gate clock provider: actual built-in compilation,
          # using only pinned public GPL-labelled donor source, ephemerally.
          # Does not provide NETSYS TOPCK/PLL, genpd or runtime proof.
          clk_donor=https://raw.githubusercontent.com/13179415360/openwrt-mt6990-lg6851f/a40df9a5afb46716dea799acea69f17480df4d82/target/linux/mediatek/files-6.18/drivers/clk/mediatek
          curl --fail --silent --show-error --location --retry 3 --max-time 90 \
            "$clk_donor/clk-mt6990-ifrao.c" -o drivers/clk/mediatek/clk-mt6990-ifrao.c
          test "$(git hash-object drivers/clk/mediatek/clk-mt6990-ifrao.c)" = \
            298a335231da6d1c7c150a49106211f2adf36128
          # Clock binding is a compile-time dependency of the provider,
          # so stage it BEFORE Image (the later DTB step reuses it).
          mkdir -p include/dt-bindings/clock
          curl --fail --silent --show-error --location --retry 3 --max-time 90 \
            "https://raw.githubusercontent.com/13179415360/openwrt-mt6990-lg6851f/a40df9a5afb46716dea799acea69f17480df4d82/target/linux/mediatek/files-6.18/include/dt-bindings/clock/mt6990-clk.h" \
            -o include/dt-bindings/clock/mt6990-clk.h
          test "$(git hash-object include/dt-bindings/clock/mt6990-clk.h)" = \
            eea7fbe58a5d5b7357c5ddb83eff6ffb74b3801a
          cat >> drivers/clk/mediatek/Kconfig <<'EOF'

          config COMMON_CLK_MT6990_IFRAO_AIR6_RESEARCH
            bool "MT6990 IFRAO clock provider (Air6 compile-only research)"
            depends on ARCH_MEDIATEK && OF
            select COMMON_CLK_MEDIATEK
          EOF
          cat >> drivers/clk/mediatek/Makefile <<'EOF'
          obj-$(CONFIG_COMMON_CLK_MT6990_IFRAO_AIR6_RESEARCH) += clk-mt6990-ifrao.o
          EOF
          make ARCH=arm64 defconfig
          scripts/config --enable BLK_DEV_INITRD \
            --set-str INITRAMFS_SOURCE "$tmp/ramfs/initramfs.cpio.gz"
          # Compile upstream GPL Ethernet pieces needed by the observed
          # MAC1 -> MT7531 MDIO switch path into this exact Image.
          # These are upstream generic drivers, NOT MT6990-specific support.
          # arm64 defconfig has IPV6=m, BRIDGE=m and HSR=m. BRIDGE
          # depends on (IPV6=y or IPV6=n), and NET_DSA cannot be built-in
          # while BRIDGE/HSR are modules. Resolve all tristate prerequisites.
          scripts/config --enable IPV6 --enable BRIDGE --disable HSR
          scripts/config --enable ARCH_MEDIATEK --enable MFD_SYSCON \
            --enable GENERIC_PHY --enable PHY_MTK_MT6990_SGMII \
            --enable COMMON_CLK_MT6990_IFRAO_AIR6_RESEARCH
          scripts/config --enable NET_DSA \
            --enable NET_DSA_MT7530 --enable NET_DSA_MT7530_MDIO \
            --disable NET_DSA_MT7530_MMIO \
            --enable NET_VENDOR_MEDIATEK --enable NET_MEDIATEK_SOC
          make ARCH=arm64 olddefconfig
          for option in NET_DSA NET_DSA_MT7530 NET_DSA_MT7530_MDIO \
                        NET_VENDOR_MEDIATEK NET_MEDIATEK_SOC PCS_MTK_LYNXI \
                        MFD_SYSCON GENERIC_PHY PHY_MTK_MT6990_SGMII \
                        COMMON_CLK_MT6990_IFRAO_AIR6_RESEARCH; do
            grep -qx "CONFIG_${option}=y" .config || {
              echo "Required upstream Ethernet component disabled: $option" >&2
              exit 1
            }
          done
          grep -Fq "CONFIG_INITRAMFS_SOURCE=\"$tmp/ramfs/initramfs.cpio.gz\"" .config
          export KBUILD_BUILD_USER=air6-source-only KBUILD_BUILD_HOST=github-hosted
          export KBUILD_BUILD_TIMESTAMP="Thu Jan  1 00:00:00 UTC 1970"
          export SOURCE_DATE_EPOCH=0
          # Fail quickly on donor/upstream API mismatch, before the full
          # ARM64 Image compilation. Still require the final built-in Image.
          timeout 300s make ARCH=arm64 -j2 drivers/clk/mediatek/clk-mt6990-ifrao.o
          test -s drivers/clk/mediatek/clk-mt6990-ifrao.o
          timeout 2700s make ARCH=arm64 -j4 Image
          test -s arch/arm64/boot/Image
          test -s usr/initramfs_data.o
          test -s vmlinux
          # Real Kbuild objects, not merely requested Kconfig flags.
          for obj in drivers/net/dsa/mt7530.o \
                     drivers/net/dsa/mt7530-mdio.o \
                     drivers/net/pcs/pcs-mtk-lynxi.o \
                     drivers/net/ethernet/mediatek/mtk_eth_soc.o \
                     drivers/net/ethernet/mediatek/mtk_eth_path.o \
                     drivers/phy/mediatek/phy-mtk-mt6990-sgmii.o \
                     drivers/clk/mediatek/clk-mt6990-ifrao.o; do
            test -s "$obj" || { echo "Missing built-in object: $obj" >&2; exit 1; }
          done
          echo 'UPSTREAM_MT7531_DSA_MEDIATEK_PCS_IMAGE_OBJECTS_PASS'
          echo 'MT6990_SGMII_PHY_PATCHED_KBUILD_OBJECT_PASS (no cold-boot or rights approval)'
          echo 'MT6990_IFRAO_CLOCK_PROVIDER_KBUILD_OBJECT_PASS (compile only; no MMIO/probe or rights approval)'
          # Linux v6.18 uses __irf_start/__irf_end and __initramfs_size;
          # it does not define the obsolete __initramfs_start/end symbols.
          nm vmlinux > "$tmp/kernel-symbols.txt"
          grep -q '__initramfs_size' "$tmp/kernel-symbols.txt"
          test -s usr/initramfs_inc_data
          cmp "$tmp/ramfs/initramfs.cpio.gz" usr/initramfs_inc_data
          python3 - "$tmp/ramfs/initramfs.cpio.gz" usr/initramfs_data.o <<'PY'
          import gzip
          from pathlib import Path
          import sys
          payload = Path(sys.argv[1]).read_bytes()
          assert b"070701" in gzip.decompress(payload)
          assert b"TRAILER!!!" in gzip.decompress(payload)
          assert Path(sys.argv[2]).stat().st_size > len(payload)
          print("EMBEDDED_INITRAMFS_OBJECT_PASS")
          PY
          sha256sum arch/arm64/boot/Image "$tmp/ramfs/initramfs.cpio.gz"
          wc -c arch/arm64/boot/Image "$tmp/ramfs/initramfs.cpio.gz"
          echo 'UPSTREAM_ARM64_IMAGE_WITH_PID1_BUILD_PASS'
          echo 'SBAT6_PROCD_INIT_STAGE_EMBEDDED_IMAGE_PASS (native musl-static, no procd runtime/boot)'
          echo 'SBAT6_PROCD_NETIFD_BOOT_POLICY_EMBEDDED_IMAGE_PASS (loopback-only policy, no runtime/boot)'
          # Execute the built Image as a QEMU virt guest with NO networking,
          # disks, host device passthrough or installable image output.
          # This is a real PID1/procd/ubus service-registration runtime check,
          # not a hardware Air6 boot or a netifd traffic test.
          # GitHub-hosted ARM64 images do not ship qemu-system-aarch64.
          # Provision it ONLY inside an ephemeral, non-privileged Docker
          # build from a digest-pinned official Ubuntu multiarch base.
          # The Ubuntu package index is signed; no host sudo/apt, no home
          # runner, no private registry or device access. Guest execution
          # has no container network, no capabilities and read-only mounts.
          command -v docker >/dev/null
          cat > "$tmp/Dockerfile.qemu" <<'EOF'
          FROM ubuntu@sha256:80dd3c3b9c6cecb9f1667e9290b3bc61b78c2678c02cbdae5f0fea92cc6734ab
          RUN apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-arm bash coreutils grep && rm -rf /var/lib/apt/lists/*
          USER 1001:1001
          EOF
          docker build --pull --file "$tmp/Dockerfile.qemu" --tag sbat6-qemu-guest:ci "$tmp"
          docker run --rm --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 128 --memory 2g --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD/arch/arm64/boot/Image,dst=/Image,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/smoke-arm64-procd-guest.sh,dst=/smoke.sh,readonly" \
            sbat6-qemu-guest:ci bash /smoke.sh /Image

          # Stage only three byte-pinned, public GPL-identified MT6990 DTS
          # inputs already used by the source-only DTC preflight. This is
          # ephemeral compilation, NOT a rights-approved redistributable DTB.
          donor=https://raw.githubusercontent.com/13179415360/openwrt-mt6990-lg6851f/a40df9a5afb46716dea799acea69f17480df4d82
          mkdir -p include/dt-bindings/{clock,power}
          fetch_checked() {
            local url="$1" dest="$2" expected="$3"
            curl --fail --silent --show-error --location --retry 3 --max-time 90 \
              "$url" -o "$dest"
            test "$(git hash-object "$dest")" = "$expected" || {
              echo "Pinned DTS input identity mismatch: $dest" >&2; exit 1;
            }
          }
          fetch_checked "$donor/target/linux/mediatek/patches-6.18/969-arm64-dts-mediatek-add-mt6990-soc.patch" \
            "$tmp/mt6990-soc.patch" 4f24ec8183c5495a312ec5f1109164d7b770a770
          # The byte-pinned clock binding was already staged before Image.
          test "$(git hash-object include/dt-bindings/clock/mt6990-clk.h)" = \
            eea7fbe58a5d5b7357c5ddb83eff6ffb74b3801a
          fetch_checked "$donor/target/linux/mediatek/files-6.18/include/dt-bindings/power/mt6990-power.h" \
            include/dt-bindings/power/mt6990-power.h c221b322fb437683d052ec4241a33afaecb33979
          python3 - "$tmp/mt6990-soc.patch" arch/arm64/boot/dts/mediatek/mt6990.dtsi <<'PY'
          from pathlib import Path
          import sys
          lines = Path(sys.argv[1]).read_text().splitlines()
          start = next((i for i, s in enumerate(lines) if s.startswith('@@ -0,0 +1,')), None)
          if start is None:
              raise SystemExit("Pinned MT6990 patch has no expected new-file hunk")
          output = [s[1:] for s in lines[start+1:] if s.startswith('+')]
          if len(output) < 400 or not output[0].startswith('// SPDX-License-Identifier:'):
              raise SystemExit("Unexpected MT6990 SoC DTSI hunk")
          Path(sys.argv[2]).write_text('\n'.join(output) + '\n')
          PY
          cp "$GITHUB_WORKSPACE/board/mt6990-air-terminal-6.dts" \
            arch/arm64/boot/dts/mediatek/
          cp "$GITHUB_WORKSPACE/board/mt6990-air-terminal-6-ethernet-test.dts" \
            arch/arm64/boot/dts/mediatek/
          cat >> arch/arm64/boot/dts/mediatek/Makefile <<'EOF'
          # Air6 independent compile-only candidates; not an installable DTB.
          dtb-$(CONFIG_ARCH_MEDIATEK) += mt6990-air-terminal-6.dtb
          dtb-$(CONFIG_ARCH_MEDIATEK) += mt6990-air-terminal-6-ethernet-test.dtb
          EOF
          scripts/config --enable ARCH_MEDIATEK
          make ARCH=arm64 olddefconfig
          grep -qx 'CONFIG_ARCH_MEDIATEK=y' .config
          # Both DTBs are built by the *same* upstream Linux Kbuild/dtc tree
          # that compiled Image, not by a separate host-only dtc checkout.
          timeout 1200s make ARCH=arm64 -j4 dtbs
          for dtb in mt6990-air-terminal-6.dtb mt6990-air-terminal-6-ethernet-test.dtb; do
            test -s "arch/arm64/boot/dts/mediatek/$dtb"
            python3 - "arch/arm64/boot/dts/mediatek/$dtb" <<'PY'
          from pathlib import Path
          import sys
          blob = Path(sys.argv[1]).read_bytes()
          assert blob[:4] == bytes.fromhex('d00dfeed'), "not a DTB"
          for needle in (b'softbank,air-terminal-6\x00', b'mediatek,mt7531\x00'):
              assert needle in blob, f"missing compiled DT property: {needle!r}"
          print("AIR6_KERNEL_TREE_DTB_CONTENT_PASS", sys.argv[1])
          PY
          done
          sha256sum arch/arm64/boot/dts/mediatek/mt6990-air-terminal-6*.dtb
          wc -c arch/arm64/boot/dts/mediatek/mt6990-air-terminal-6*.dtb
          echo 'UPSTREAM_KERNEL_TREE_AIR6_DTBS_BUILD_PASS'
          echo 'LIMIT: MT6990 SoC DTSI provenance/rights and matching drivers remain unverified; no dtbs_check or device boot.'
          echo 'LIMIT: Image contains procd preinit/inittab/netifd registration policy; no verified runtime, external network, wpad, SSH, boot or AP evidence.'
